<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07131b">
  <title>NaviTurni V2</title>
  <link rel="stylesheet" href="assets/app.css?v=3">
  <link rel="stylesheet" href="assets/turni-compact.css?v=6">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="brand">Navi<b>Turni</b> V2</div>
        <div id="who" class="status"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <a class="btn ghost" href="index.html">Menu</a>
        <button id="logout" class="btn ghost" type="button">Esci</button>
      </div>
    </header>

    <!-- Controlli legacy tenuti solo come API interna del renderer V2. -->
    <div class="turni-legacy-meta" aria-hidden="true">
      <select id="residence" tabindex="-1"></select>
      <button id="prev" type="button">Indietro</button>
      <button id="today" type="button">Oggi</button>
      <button id="next" type="button">Avanti</button>
      <span id="rangeLabel"></span>
      <span id="status"></span>
    </div>

    <section id="tableWrap" class="table-card"><div class="empty">Caricamento…</div></section>
  </main>
  <script src="assets/pb.js?v=1"></script>
  <script src="assets/turni.js?v=3"></script>
  <script src="assets/turni-ui.js?v=4"></script>
</body>
</html>
