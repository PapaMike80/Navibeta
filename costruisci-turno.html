<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NaviBeta">
  <meta name="theme-color" content="#0d1a1c">
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/icona_apple_180.png">
  <title>NaviBeta Costruisci turno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/shared-menu.css?v=2">
  <style>
    /* Costruisci turno: stile a riquadri (docs/STILE-NAVISUITE.md). Pagina per PC; da telefono si consulta. */
    :root{--surface:#0b1c26;--card:#102733;--card2:#143140;--line:#1f4250;--ink:#eaf2f4;--muted:#9fb8c2;--on:#06231f;--teal:#2dd4bf;--cyan:#67d7e6;--violet:#a78bfa;--amber:#fbbf24;--rose:#fb7185;--green:#52c879;color-scheme:dark}
    *{box-sizing:border-box}
    html{background:var(--surface)}
    body.costruisci-page{margin:0;min-height:100vh;background:linear-gradient(160deg,color-mix(in srgb,var(--teal) 9%,var(--surface)),var(--surface) 40%,color-mix(in srgb,var(--violet) 9%,var(--surface)));color:var(--ink);font:500 13px/1.4 Manrope,system-ui,sans-serif}
    .costruisci-page .app-sidebar{display:none}
    .costruisci-page>header{display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(1600px,100%);margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
    .costruisci-page>header small{display:block;color:var(--teal);font-size:11px;font-weight:800;letter-spacing:.2em}
    .costruisci-page>header h1{margin:4px 0 0;font-size:25px;font-weight:800;background:linear-gradient(90deg,var(--teal),var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
    .costruisci-page>header #navisuite-header-menu{position:static!important;flex-shrink:0;width:48px!important;height:48px!important;border:1px solid var(--line)!important;border-radius:14px!important;background:var(--card)!important;color:var(--teal)!important;font-size:22px!important}
    main{display:grid;gap:12px;width:min(1600px,100%);margin:0 auto 48px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
    .barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:800 12.5px Manrope,system-ui,sans-serif;cursor:pointer}
    .chip.on{background:var(--teal);color:var(--on);border-color:var(--teal)}
    .chip input,.chip select{border:0;background:transparent;color:inherit;font:inherit;color-scheme:dark}.chip select option{background:#102733}.chip:disabled{opacity:.5;cursor:not-allowed}
    .gruppo{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line)}.gruppo .chip{border:0;min-height:30px;background:transparent}.gruppo .chip.on{background:var(--teal)}
    .btn{min-height:38px;padding:0 18px;border-radius:12px;border:0;background:linear-gradient(90deg,var(--teal),var(--cyan));color:var(--on);font:800 13px Manrope,system-ui,sans-serif;cursor:pointer}
    .btn:disabled{opacity:.55;cursor:progress}
    .stato{color:var(--muted);font-size:12px}
    .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.kpis:empty{display:none}
    .k{--c:var(--teal);padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,var(--card));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);display:grid;gap:1px}
    .k small{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--c);text-transform:uppercase}.k b{font:500 22px 'DM Mono',ui-monospace,monospace}.k span{font-size:11px;color:var(--muted)}
    .cols{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;align-items:start}
    .sez{--c:var(--teal);border-radius:16px;padding:12px;background:color-mix(in srgb,var(--c) 8%,var(--card));border:1px solid color-mix(in srgb,var(--c) 38%,transparent);display:grid;gap:8px;min-width:0}
    .sez h3{margin:0;font-size:14px;color:var(--c)}.sez p{margin:0;color:var(--muted);font-size:12px}
    #ct-lati{display:grid;gap:12px}
    .scroll{overflow:auto;max-height:70vh}
    table{border-collapse:separate;border-spacing:2px;font-size:10px}
    th{position:sticky;top:0;background:var(--card);color:var(--muted);font-weight:800;font-size:9px;line-height:1.15;z-index:1}th.dom{color:var(--rose)}
    td.n{position:sticky;left:0;background:var(--card);white-space:nowrap;font-weight:800;padding-right:6px;font-size:11px;z-index:1}
    .c{display:inline-grid;place-items:center;width:30px;height:22px;border-radius:6px;font:900 9px Manrope,system-ui,sans-serif;color:var(--on)}
    .c.rip{background:transparent;color:#2b5363}.c.fisso{background:#a78bfa33;color:#ddd6fe;font-weight:700;font-size:8px}
    .c.tr{outline:2px dashed var(--amber);outline-offset:1px}.c.warn{outline:2px solid var(--rose)}
    .gr{display:inline-grid;place-items:center;width:26px;height:18px;margin-right:6px;border-radius:9px;border:1.5px solid var(--g);color:var(--g);font-size:8px;font-weight:900}
    .leg{display:flex;flex-wrap:wrap;gap:8px 12px;color:var(--muted);font-size:11px;align-items:center}
    .list{display:grid;gap:5px;max-height:320px;overflow:auto}.it{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 9px;border-radius:10px;background:var(--card);border-left:3px solid var(--c);font-size:12px}.it b{color:var(--c)}
    .gq{display:grid;gap:4px;padding:8px;border-radius:12px;background:var(--card)}.gqh{display:flex;justify-content:space-between;align-items:center}
    .pill{padding:1px 8px;border-radius:999px;border:1px solid #52c87966;color:var(--green);font-size:11px;font-weight:800}
    .bar{display:grid;grid-template-columns:120px 1fr auto;gap:6px;align-items:center;font-size:11px;font-weight:700}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar i{height:8px;border-radius:9px;background:linear-gradient(90deg,var(--c) var(--w),#1f4250 var(--w))}.bar small{grid-column:1/-1;color:var(--muted);font-size:10px;margin-top:-2px}
    .mono{font-family:'DM Mono',ui-monospace,monospace;font-weight:500}
    .vuoto{margin:0;padding:24px;text-align:center;color:var(--muted)}
    /* Ferie e ore, Stagionali (le compila l'ufficio) */
    .richieste{display:grid;gap:12px}.richieste:empty{display:none}
    details.sez>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px}details.sez>summary::-webkit-details-marker{display:none}
    details.sez>summary h3{flex:1}details.sez>summary::after{content:'▾';color:var(--muted)}details.sez[open]>summary::after{content:'▴'}
    .tab{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:12px}
    .tab th{position:static;background:transparent;text-align:left;font-size:9.5px;letter-spacing:.1em;padding:0 8px}
    .tab td{background:var(--card);padding:6px 8px;vertical-align:middle}.tab td:first-child{border-radius:9px 0 0 9px;font-weight:800;white-space:nowrap}.tab td:last-child{border-radius:0 9px 9px 0}
    .seg{display:inline-flex;gap:2px;padding:2px;border-radius:999px;background:var(--card2)}
    .seg button{border:0;border-radius:999px;padding:4px 10px;background:transparent;color:var(--muted);font:800 11px Manrope,system-ui,sans-serif;cursor:pointer}
    .seg button.on[data-ore="39"]{background:#38bdf8;color:var(--on)}.seg button.on[data-ore="normale"]{background:var(--muted);color:var(--on)}.seg button.on[data-ore="max"]{background:var(--amber);color:var(--on)}
    .fer{display:inline-flex;align-items:center;gap:4px;margin:2px 4px 2px 0;padding:2px 4px 2px 8px;border-radius:7px;background:#a78bfa33;color:#ddd6fe;font:700 11px 'DM Mono',ui-monospace,monospace}
    .fer button,.mini{border:0;background:transparent;color:inherit;font:800 12px Manrope,system-ui,sans-serif;cursor:pointer}
    .mini{padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}.mini.ok{border-color:var(--violet);color:var(--violet)}
    .agg{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}.agg input{padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:600 12px Manrope,system-ui,sans-serif;color-scheme:dark}
    .tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10px;font-weight:900}.tag.wa{background:#fbbf2426;color:#fde68a}.tag.ok{background:#52c87926;color:#86efac}.tag.ro{background:#fb718526;color:#fda4af}
    /* Navi e corse del periodo */
    .nriga{display:grid;grid-template-columns:96px 210px 240px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--card)}
    .nriga.spenta{opacity:.6}.nt{display:flex;gap:8px;align-items:center}
    .chip-t{padding:2px 9px;border-radius:999px;font-weight:900;font-size:12px}
    .tg{width:36px;height:20px;border:0;border-radius:99px;background:var(--card2);position:relative;cursor:pointer;flex:none}.tg::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted)}.tg.on{background:#38bdf8}.tg.on::after{left:19px;background:var(--on)}
    .nv{display:grid;gap:2px;min-width:0}.nv select{padding:5px 8px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--ink);font:800 12px Manrope,system-ui,sans-serif;color-scheme:dark;max-width:100%}.nv small{color:var(--muted);font-size:10.5px}
    .cs{display:flex;flex-wrap:wrap;gap:3px}.cr{padding:2px 7px;border-radius:7px;background:#38bdf826;color:#bae6fd;font:500 11px 'DM Mono',ui-monospace,monospace;border:1px solid #38bdf866;cursor:pointer}.cr.no{background:transparent;color:var(--muted);text-decoration:line-through;border-style:dashed}
    .nstrip{min-width:0;overflow-x:auto}.strip{display:flex;gap:2px;align-items:center}
    .g{flex:none;width:28px;height:22px;border:0;border-radius:5px;background:#1f425099;color:var(--muted);font:800 8.5px Manrope,system-ui,sans-serif;cursor:pointer;padding:0}
    .g.ecc{background:var(--amber);color:var(--on)}.g.off{background:transparent;border:1px dashed var(--rose);color:var(--rose)}.g.spento{background:transparent;color:#2b5363}.sepg{flex:none;width:6px}
    .nota{display:block;color:var(--amber);font-size:11px;margin-top:3px}.cs .nota{margin:0;color:var(--muted)}
    .edit-g{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--card2);font-size:12px}
    .edit-g select{padding:4px 8px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:700 12px Manrope,system-ui,sans-serif;color-scheme:dark}
    @media(max-width:1000px){.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
<script src="assets/js/beta-readonly.js?v=5"></script>
</head>
<body class="costruisci-page">
  <aside class="app-sidebar" aria-hidden="true"></aside>
  <header class="page-header"><div><small>MOVIMENTO · ADMIN</small><h1>Costruisci turno</h1></div></header>
  <main>
    <div class="barra">
      <label class="chip">📅 dal <input type="date" id="ct-dal" aria-label="Primo giorno (lunedì)"></label><label class="chip"><select id="ct-sett" aria-label="Settimane"><option value="4">4 settimane</option><option value="2">2 settimane</option></select></label>
      <div class="gruppo" id="ct-res"><button class="chip" type="button" data-res="DESENZANO">Desenzano</button><button class="chip" type="button" data-res="MADERNO">Maderno</button><button class="chip" type="button" data-res="RIVA">Riva</button><button class="chip" type="button" data-res="PESCHIERA">Peschiera</button></div>
      <div class="gruppo" id="ct-vista"><button class="chip" type="button" data-vista="bozza">Bozza</button><button class="chip" type="button" data-vista="attuale">Turno attuale</button></div>
      <span style="flex:1"></span>
      <button class="chip" id="ct-pdf" type="button" disabled>⤓ Esporta PDF</button>
      <button class="btn" id="ct-genera" type="button" disabled>⚡ Genera bozza</button>
    </div>
    <p class="stato" id="ct-stato"></p>
    <div id="ct-richieste" class="richieste"></div>
    <div class="kpis" id="ct-kpi"></div>
    <div class="cols">
      <section class="sez" id="ct-griglia"></section>
      <div id="ct-lati"></div>
    </div>
  </main>
  <script src="assets/js/shared-roles.js?v=15"></script>
  <script src="assets/js/admin-firebase-rest.js?v=92"></script>
  <script src="assets/js/shared-data.js?v=137"></script>
  <script src="assets/js/firebase-auth.js?v=2"></script>
  <script src="assets/js/shared-menu.js?v=1.98"></script>
  <script src="assets/js/offline.js?v=2"></script>
  <script src="assets/js/course-info.js?v=1"></script>
  <script src="assets/js/turni-giorno.js?v=12"></script>
  <script src="assets/js/servizi-terra-a4.js?v=21"></script>
  <script src="assets/js/orario-corse.js?v=1"></script>
  <script src="assets/js/orario-corse-estate.js?v=1"></script>
  <script src="assets/js/orario-giorno.js?v=7"></script>
  <script src="assets/js/orari-stagioni.js?v=9"></script>
  <script src="assets/js/shift-competence.js?v=4"></script>
  <script src="vendor/pdf/jspdf.umd.min.js"></script>
  <script src="assets/js/turno-pdf.js?v=2"></script>
  <script src="assets/js/costruisci-turno-motore.js?v=4"></script>
  <script src="assets/js/costruisci-turno.js?v=5"></script>
</body>
</html>
