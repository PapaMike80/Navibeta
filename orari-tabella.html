<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NaviSuite Orari</title>
  <link rel="stylesheet" href="assets/css/shared-menu.css">
  <style>
    :root{
      --bg:#07131b;
      --panel:#0d202b;
      --panel-soft:rgba(13,32,43,.88);
      --card:#122b37;
      --line:#234452;
      --line-soft:rgba(35,68,82,.42);
      --ink:#edf6f7;
      --ink-dim:#9bb4bc;
      --accent:#38d6bf;
      --accent-soft:rgba(56,214,191,.14);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:
        radial-gradient(1100px 560px at 12% -8%,rgba(18,56,70,.55) 0,transparent 62%),
        var(--bg);
      color:var(--ink);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main{padding:16px 18px 24px}
    .page-shell{display:grid;gap:14px}
    .toolbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--panel-soft);
      box-shadow:0 14px 30px rgba(0,0,0,.24);backdrop-filter:blur(12px)
    }
    .toolbar-copy h1{margin:0;font:800 22px/1.1 Manrope,Inter,sans-serif}
    .toolbar-copy p{margin:6px 0 0;color:var(--ink-dim);font-size:13px}
    .toolbar-actions{display:flex;flex-wrap:wrap;gap:8px}
    .btn{
      min-height:38px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;
      background:var(--card);color:var(--ink);font:700 12px/1 Inter,sans-serif;cursor:pointer;
      text-decoration:none
    }
    .btn.primary{border-color:rgba(56,214,191,.58);background:var(--accent-soft);color:var(--accent)}
    .status{
      padding:8px 12px;border:1px solid rgba(56,214,191,.22);border-radius:12px;
      background:rgba(56,214,191,.08);color:#a7f3e8;font-size:12px;font-weight:700
    }
    .note{
      padding:12px 14px;border:1px solid var(--line-soft);border-radius:16px;
      background:rgba(9,28,37,.72);color:var(--ink-dim);font-size:13px;line-height:1.45
    }
    .tables{display:grid;gap:18px}
    .table-card{
      border:1px solid var(--line);border-radius:20px;background:var(--panel-soft);overflow:hidden;
      box-shadow:0 16px 34px rgba(0,0,0,.26);backdrop-filter:blur(12px)
    }
    .table-head{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:14px 16px 12px;border-bottom:1px solid var(--line-soft);background:rgba(7,25,35,.72)
    }
    .table-head h2{margin:0;font:800 18px/1.1 Manrope,Inter,sans-serif}
    .table-head p{margin:4px 0 0;color:var(--ink-dim);font-size:12px}
    .scroll-wrap{overflow:auto;max-width:100%;max-height:calc(100dvh - 220px);max-height:calc(100vh - 220px)}
    table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
    th,td{
      min-width:68px;padding:8px 6px;border-right:1px solid rgba(35,68,82,.38);
      border-bottom:1px solid rgba(35,68,82,.38);text-align:center;vertical-align:middle;white-space:nowrap
    }
    thead th{position:sticky;top:0;z-index:3;background:#13303c;color:var(--ink);box-shadow:0 2px 0 rgba(35,68,82,.72)}
    th.race-col{background:rgba(19,48,60,.96);box-shadow:inset 0 -2px 0 var(--col-color, #38d6bf)}
    th.stop-col,td.stop-col{
      position:sticky;left:0;z-index:4;min-width:188px;text-align:left;padding-left:12px;background:#102733
    }
    thead th.stop-col{z-index:5;background:#163744}
    .race-head{display:grid;gap:3px;justify-items:center}
    .race-code{font-size:13px;font-weight:800;color:#fff}
    .race-shift{
      display:inline-flex;align-items:center;justify-content:center;min-width:38px;padding:3px 7px;border-radius:999px;
      font-size:10px;font-weight:900;letter-spacing:.04em
    }
    td.time-cell{
      color:var(--ink);font-size:12px;font-weight:700;cursor:text;
      background:rgba(13,32,43,.88);
      border-bottom-color:rgba(35,68,82,.38);border-right-color:rgba(35,68,82,.38)
    }
    tbody tr:nth-child(odd) td.time-cell{background:rgba(18,43,55,.86)}
    tbody tr:nth-child(even) td.time-cell{background:rgba(13,32,43,.88)}
    td.time-cell.empty{color:#5f7782;font-weight:600}
    td.time-cell.edited{background:rgba(245,158,11,.15)!important;color:#fde68a;box-shadow:inset 0 0 0 1px rgba(245,158,11,.45)}
    td.time-cell.is-editing{outline:2px solid rgba(56,214,191,.52);outline-offset:-2px;background:rgba(56,214,191,.1)!important}
    td.time-cell:focus{outline:none}
    .stop-name{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--ink)}
    .stop-index{color:#68828d;font-size:10px;font-weight:800;letter-spacing:.06em}
    .hidden-file-input{display:none}
    @media (max-width:800px){
      main{padding:12px}
      .toolbar{padding:12px}
      .toolbar-copy h1{font-size:19px}
      th,td{min-width:60px;padding:7px 5px}
      th.stop-col,td.stop-col{min-width:146px}
      .scroll-wrap{max-height:none}
    }
  </style>
</head>
<body class="turni-page orario-data-page">
  <aside class="app-sidebar" id="orari-tabella-sidebar"></aside>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NaviDiaria">
  <meta name="theme-color" content="#002b5e">
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/icona_apple_180.png">
  <link rel="apple-touch-startup-image" href="assets/images/splash_ios.png">
  <main>
    <div class="page-shell">
      <section class="toolbar">
        <div class="toolbar-copy">
          <h1>NaviSuite Orari</h1>
          <p>Due viste editabili, una verso nord e una verso sud.</p>
        </div>
        <div class="toolbar-actions">
          <a class="btn" href="Orario.html">Apri grafico</a>
          <button class="btn primary" id="saveChanges" type="button">Salva locale</button>
          <button class="btn" id="exportChanges" type="button">Esporta JSON</button>
          <button class="btn" id="importChanges" type="button">Importa JSON</button>
          <button class="btn" id="resetChanges" type="button">Ripristina</button>
        </div>
      </section>
      <div class="status" id="editStatus">Carico gli orari…</div>
      <div class="note">Su iPhone fai doppio tap su una cella per modificarla. Le modifiche locali vengono poi lette anche dal grafico su questo stesso browser.</div>
      <div class="tables" id="tablesRoot"></div>
    </div>
  </main>
  <input class="hidden-file-input" id="importFile" type="file" accept="application/json">
  <script src="assets/js/shared-menu.js?v=1.46"></script>
  <script src="assets/js/orario-shared.js"></script>
  <script src="assets/js/orario-main.js"></script>
  <script src="assets/js/storageService.js"></script>
  <script src="assets/js/orari-tabella.js"></script>

  <script src="assets/js/admin-firebase-rest.js?v=39"></script>
  <script src="assets/js/announcements-recovered.js?v=1"></script>
</body>
</html>
