<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaviSuite Scali</title>
  <!-- Servizi a terra e' ora nella pagina Scali (orario.html): qui solo il rimando per link e segnalibri. -->
  <script>
    (function () {
      var res = (new URLSearchParams(location.search).get('res') || '').toLowerCase();
      location.replace('orario.html' + (res === 'maderno' ? '?scalo=Maderno' : res === 'desenzano' ? '?scalo=Desenzano' : ''));
    })();
  </script>
</head>
<body style="background:#061821;color:#e8f7f7;font-family:sans-serif">
  <p>Servizi a terra è ora nella pagina <a href="orario.html" style="color:#5eead4">Scali</a>.</p>
</body>
</html>
