<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NaviSuite">
  <meta name="theme-color" content="#0d1a1c">
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/icona_apple_180.png">
  <title>NaviSuite Verifica busta paga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/shared-menu.css?v=2">
  <style>
    /* Schede a colori: barra unica in alto, linguette Confronto / Anno. Verde ok, rosso differenza, giallo da verificare;
       azzurro lordo, rosa ritenute, turchese netto. */
    :root{--bg:#0b1c26;--card:#102733;--card2:#143140;--line:#1f4250;--ink:#eaf2f4;--muted:#9fb8c2;--teal:#2dd4bf;--on-teal:#06231f;--cyan:#67d7e6;--rose:#fb7185;--amber:#fbbf24;--green:#52c879;--violet:#a78bfa;--mono:'DM Mono',ui-monospace,monospace;color-scheme:dark}
    html.navisuite-light{--bg:#f4f8f7;--card:#ffffff;--card2:#e8f1ef;--line:#dbe7e5;--ink:#102631;--muted:#5b7079;--teal:#0f9f8c;--on-teal:#ffffff;--cyan:#1590a8;--rose:#d9435e;--amber:#b7791f;--green:#2f9e5a;--violet:#7c5cd6;color-scheme:light}
    *{box-sizing:border-box}
    body.verifica-busta-page{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:500 15px/1.5 Manrope,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
    .verifica-busta-page .app-sidebar{display:none}
    .verifica-busta-page>header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
    .verifica-busta-page>header small{display:block;color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.22em}
    .verifica-busta-page>header h1{margin:4px 0 0;font-size:26px;font-weight:800;line-height:1.15}
    .verifica-busta-page>header #navisuite-header-menu{position:static!important;flex-shrink:0;width:48px!important;height:48px!important;border:1px solid var(--line)!important;border-radius:14px!important;background:var(--card)!important;color:var(--teal)!important;font-size:22px!important}
    main{display:flex;flex-direction:column;gap:12px;width:min(720px,100%);margin:0 auto 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
    .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
    .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
    .vb-login{margin:0;padding:16px;border-radius:16px;background:var(--card)}.vb-login a{color:var(--teal);font-weight:700}
    .vb-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:700 13px Manrope,system-ui,sans-serif;cursor:pointer}
    .chip.up{border-color:var(--teal);color:var(--teal);background:transparent}
    .chip.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
    .chip:focus-visible,.vb-tabs button:focus-visible,.voce:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
    .chip select{border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer}
    .chip.is-busy{opacity:.6;cursor:progress}
    .vb-info{margin:0;color:var(--muted);font-size:13px}.vb-info:empty{display:none}
    .vb-meta{margin:0;color:var(--muted);font-size:12px}.vb-meta:empty{display:none}
    #vbAlerts{display:grid;gap:8px}#vbAlerts:empty{display:none}
    .vb-alert{margin:0;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 14%,var(--card));font-size:13px}
    .vb-alert.error{border-color:color-mix(in srgb,var(--rose) 50%,transparent);background:color-mix(in srgb,var(--rose) 14%,var(--card))}
    .drop{display:block;border:2px dashed var(--teal);border-radius:20px;padding:30px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5;cursor:pointer;background:color-mix(in srgb,var(--teal) 6%,transparent)}
    .drop b{display:block;color:var(--teal);font-size:18px;margin-bottom:4px}
    .vb-private{margin:0;color:var(--muted);font-size:12px}
    .vb-tabs{display:flex;background:var(--card);border-radius:14px;padding:4px}
    .vb-tabs button{flex:1;padding:9px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:700 14px Manrope,system-ui,sans-serif;cursor:pointer}
    .vb-tabs button[aria-selected="true"]{background:var(--teal);color:var(--on-teal)}
    .sel{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.sel .chip{flex:0 0 auto}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex-shrink:0}
    .mtitle{margin:2px 0 0;font-size:20px;font-weight:800}.msub{margin:0;color:var(--muted);font-size:12px}
    .tot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card)}
    .tot small{display:block;font:800 10px Manrope,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .tot-main{display:flex;align-items:center;gap:8px}
    .tot-n{font-size:22px;font-weight:600;color:var(--teal)}
    .vb-blur-btn{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:9px;background:var(--card2);color:var(--ink);font-size:15px;line-height:1;cursor:pointer;transition:border-color .15s,background .15s}
    .vb-blur-btn:hover{border-color:var(--teal)}
    body.vb-blur .vb-blur-btn{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 18%,var(--card2))}
    .vb-irpef-btn{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:9px;background:var(--card2);color:var(--muted);font:800 11.5px/1 Manrope,system-ui,sans-serif;cursor:pointer;transition:border-color .15s,background .15s,color .15s}
    .vb-irpef-btn:hover{border-color:var(--teal);color:var(--ink)}
    .vb-irpef-btn.is-active{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 16%,var(--card2));color:var(--teal)}
    .tot-side{text-align:right;font-size:12px;color:var(--muted);line-height:1.6}.tot-side b{color:var(--ink);font-weight:500}
    .vb-busta-sub{display:block;color:var(--muted);font:500 11.5px Manrope,system-ui,sans-serif;margin-top:1px}
    .tile{display:inline-flex;align-items:baseline;gap:4px;border-radius:999px;padding:3px 8px;color:#06231f;font-size:11px;font-weight:700;white-space:nowrap}
    .tile small{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
    .t-l{background:var(--cyan)}.t-r{background:var(--rose)}.t-n{background:var(--teal)}
    html.navisuite-light .tile{color:#fff}
    .sum{display:flex;gap:6px}.sum span{flex:1;text-align:center;border-radius:10px;padding:6px 0;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
    .voci{display:grid;gap:6px}
    .voce{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:11px 12px;border:0;border-left:4px solid var(--c);border-radius:12px;background:var(--card);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
    .voce .n{font-weight:800;font-size:14px;min-width:0}
    .voce .eur{font-weight:500;font-size:12px;color:var(--cyan);margin-left:4px}
    .voce .c{color:var(--muted);font-size:12px;min-width:0}
    .pill{grid-row:span 2;align-self:center;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);white-space:nowrap}
    .det{grid-column:1/-1;display:none;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
    .voce[aria-expanded="true"] .det{display:grid}
    .det small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
    .det p{grid-column:1/-1;margin:0;color:var(--muted);line-height:1.45;font-family:Manrope,system-ui,sans-serif}
    .altre{border-radius:12px}.altre>summary{list-style:none;cursor:pointer;text-align:center;padding:8px;color:var(--muted);font-size:13px;font-weight:700}.altre>summary::-webkit-details-marker{display:none}.altre[open]>summary{margin-bottom:6px}
    .mail{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--amber) 14%,var(--card));border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);font-size:13px}
    .mail{display:block}.mail-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}.mail b{color:var(--amber)}.mail a{text-decoration:none}
    .mail-ogg{margin:10px 0 4px;font-size:12px}.mail-testo{margin:0;max-height:520px;overflow:auto;padding:10px;border-radius:10px;background:var(--bg);color:var(--ink);font:11px/1.5 var(--mono);white-space:pre;user-select:text}
    .ok-all{padding:12px;border-radius:14px;background:color-mix(in srgb,var(--green) 14%,var(--card));color:var(--green);font-weight:700;font-size:14px;text-align:center}
    .spark{display:flex;align-items:flex-end;gap:4px;height:90px;padding:10px 10px 0;border-radius:14px;background:var(--card)}
    .spark div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
    .spark i{display:block;width:100%;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px}
    .spark i.r{background:var(--rose)}.spark i.v{background:var(--line)}
    .spark i{position:relative;overflow:hidden}.spark i b{position:absolute;left:0;right:0;bottom:0;background:var(--amber)}
    .legenda{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;color:var(--muted);font-size:12px}.legenda .q{display:inline-block;width:10px;height:10px;border-radius:3px}.q-n{background:var(--teal)}.q-s{background:var(--amber)}.legenda b{color:var(--amber)}
    .spark span{font-size:9px;color:var(--muted);padding-bottom:4px}
    .ylist{display:grid;gap:6px}
    .yr{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--card);font-size:14px}
    .yr button{border:0;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left;padding:0}
    .yr .mm{font-weight:800}.yr .x{color:var(--muted);font-size:16px;padding:0 4px}
    .vtab{width:100%;border-collapse:collapse;font-size:13px}.vtab th,.vtab td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.vtab th{color:var(--muted);font-size:11px}
    .vtab td small{display:block;color:var(--muted);font-size:11px}.vwrap{overflow-x:auto}
    .stima-tag{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber);font:800 10px Manrope,system-ui,sans-serif;letter-spacing:.04em;vertical-align:middle}
    .tot.stima{border:1px dashed color-mix(in srgb,var(--amber) 55%,transparent)}.tot.stima .tot-n{color:var(--amber)}.range{font-size:12px;color:var(--muted)}
    .grp{margin:6px 0 0;font:800 10px Manrope,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.voce.st{cursor:default;--c:var(--cyan)}
    .chip-stima{border-style:dashed;border-color:var(--amber);color:var(--amber)}.chip-stima.on{background:var(--amber);border-color:var(--amber);color:#2a1d00}
    .spark i.s{background:repeating-linear-gradient(135deg,var(--amber) 0 4px,color-mix(in srgb,var(--amber) 45%,transparent) 4px 8px)}.q-st{background:var(--amber);opacity:.6}
    body.vb-blur .eurv{filter:blur(7px);user-select:none}
    /* Barra stile "Il mio turno" (terra-day) + striscia chip centrata sul mese attivo */
    .vb-datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .terra-day{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:1}
    .terra-day-nav{position:relative;z-index:2;touch-action:manipulation;-webkit-tap-highlight-color:transparent;flex:0 0 auto;width:36px;height:36px;display:grid;place-items:center;border:1px solid #2f5661;border-radius:10px;background:#0d202b;color:#8fd7cb;font-size:20px;font-weight:900;line-height:1;cursor:pointer;transition:background .15s,border-color .15s}
    .terra-day-nav:hover:not(:disabled){border-color:var(--teal);background:#12303a}
    .terra-day-nav:disabled{opacity:.32;cursor:default}
    .terra-day-current{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1;min-width:160px;min-height:36px;padding:0 14px;border:1px solid #2f5661;border-radius:10px;background:#0d202b;transition:border-color .15s}
    .terra-day-current:hover{border-color:var(--teal)}
    .terra-day-label{color:#e8f7f7;font-size:13.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap;pointer-events:none}
    .terra-day-chev{color:var(--teal);font-size:11px;pointer-events:none;opacity:.85}
    .terra-day-input{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;font-size:15px;-webkit-appearance:none;appearance:none;cursor:pointer;background:#0d202b;color:#e8f7f7}
    .terra-day-input option,.terra-day-input optgroup{background:#0d202b;color:#e8f7f7}
    .terra-day-today{flex:0 0 auto;min-height:36px;padding:0 12px;border:1px solid #47cbb9;border-radius:10px;background:#123c3c;color:#a4fff1;font:800 12px Manrope,system-ui,sans-serif;cursor:pointer}
    .terra-day-today:hover{background:#174d4d}
    html.navisuite-light .terra-day-nav,html.navisuite-light .terra-day-current{background:#fff;border-color:#c6dde0;color:#0f9f8c}
    html.navisuite-light .terra-day-label{color:#102631}
    .sel{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-ms-overflow-style:none}.sel::-webkit-scrollbar{display:none}.sel .chip{flex:0 0 auto;min-height:32px;padding:0 11px;font-size:12px}

    /* Intestazione snella in stile NaviSuite */
    .vb-head-card{border:1px solid #244653;border-radius:16px;background:linear-gradient(160deg,#0d2530,#0a1d26);box-shadow:0 10px 26px rgba(0,0,0,.18);padding:11px 13px;display:grid;gap:10px}
    html.navisuite-light .vb-head-card{background:#fff;border-color:#cfe0e3;box-shadow:0 6px 18px rgba(16,38,49,.06)}
    .vb-prof-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
    .vb-prof-main{display:flex;flex-wrap:wrap;align-items:center;gap:7px 9px;min-width:0}
    .vb-matr{display:inline-flex;align-items:center;padding:3px 8px;border:1px solid color-mix(in srgb,var(--teal) 50%,transparent);border-radius:8px;background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal);font:800 11.5px/1 var(--mono)}
    .vb-nome{font:800 15.5px/1.15 Manrope,system-ui,sans-serif;color:var(--ink);letter-spacing:-.01em}
    .vb-meta-pills{display:inline-flex;flex-wrap:wrap;align-items:center;gap:5px}
    .vb-mpill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);font:700 11px/1.2 Manrope,system-ui,sans-serif}
    .vb-mpill b{color:var(--ink);font-weight:800}
    .vb-prof-right{display:flex;align-items:center;gap:8px;margin-left:auto}
    .vb-comp-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;background:color-mix(in srgb,var(--cyan) 13%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 40%,transparent);color:var(--cyan);font:800 11px/1.2 var(--mono)}
    .vb-more{grid-column:1/-1}
    .vb-more>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--muted);font:700 11.5px Manrope,system-ui,sans-serif;user-select:none}
    .vb-more>summary::-webkit-details-marker{display:none}
    .vb-more>summary:hover{color:var(--teal)}
    .vb-more-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:6px 10px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px}
    .vb-more-grid div{display:flex;flex-direction:column;gap:1px}
    .vb-more-grid small{color:var(--muted);font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
    .vb-more-grid b{color:var(--ink);font-weight:700}
    .vb-fp-single{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;padding:9px 12px;border:1px solid color-mix(in srgb,var(--teal) 48%,var(--line));border-radius:12px;background:linear-gradient(145deg,color-mix(in srgb,var(--teal) 15%,transparent),color-mix(in srgb,var(--cyan) 7%,transparent))}
    html.navisuite-light .vb-fp-single{background:#eef9f6}
    .vb-fp-main{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
    .vb-fp-main small{font:800 10.5px Manrope,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
    .vb-fp-main b{font:800 18px/1 var(--mono);color:var(--ink)}
    .vb-fp-main em{font:700 11.5px Manrope,system-ui,sans-serif;color:var(--cyan);font-style:normal}
    .vb-fp-mini{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:11px;color:var(--muted)}
    .vb-fp-mini span b{color:var(--ink);font-family:var(--mono);font-weight:700}
    #vbMeseNav{display:grid;gap:6px}
    #vbMeseNav[hidden]{display:none!important}
    @media(max-width:640px){
      .vb-prof-right{margin-left:0}
    }
    .vb-corr-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
    .vb-corr-bar-btns{display:flex;flex-wrap:wrap;gap:6px}
    .vb-btn-allinea{border-color:color-mix(in srgb,var(--teal) 55%,transparent);background:color-mix(in srgb,var(--teal) 16%,var(--card));color:var(--teal);font-weight:800}
    .vb-btn-annulla{border-color:color-mix(in srgb,var(--amber) 55%,transparent);background:color-mix(in srgb,var(--amber) 14%,var(--card));color:var(--amber);font-weight:800}
    .vb-corr-row{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding-top:6px;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
    .vb-corr-btns{display:flex;flex-wrap:wrap;gap:6px}
    .vb-corr-action{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--teal) 50%,transparent);background:color-mix(in srgb,var(--teal) 15%,transparent);color:var(--teal);font-size:11.5px;font-weight:800;cursor:pointer}
    .vb-corr-action:hover{background:color-mix(in srgb,var(--teal) 26%,transparent)}
    .vb-corr-action.is-move{border-color:color-mix(in srgb,var(--cyan) 55%,transparent);background:color-mix(in srgb,var(--cyan) 16%,transparent);color:var(--cyan)}
    .vb-corr-action.is-move:hover{background:color-mix(in srgb,var(--cyan) 28%,transparent)}
    .vb-corr-action.is-note{border-color:color-mix(in srgb,var(--muted) 45%,transparent);background:color-mix(in srgb,var(--muted) 12%,transparent);color:var(--ink)}
    .vb-corr-action.is-undo{border-color:color-mix(in srgb,var(--amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}
