  <style>
    /* coincidenze sotto lo scalo (Il mio turno) */
    .navi-list .dove:has(.mt-coinc){flex-wrap:wrap}
    .mt-coinc{flex:1 0 100%;width:100%;min-width:0;display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:11.5px;color:#cfe3ea;font-weight:600}
    .mt-coinc>span{display:block;line-height:1.35}
    .mt-coinc small{display:block;font-weight:500;color:#9fb8c2;font-size:10.5px}
    .mt-regola{margin:10px 2px 0;font-size:11.5px;line-height:1.4;color:#fbbf24}
    .mt-comit>span{color:#67d7e6}.mt-comit b{color:#eaf2f4}
    .mt-coinc>span.cp{color:#9fb8c2;font-weight:500}
    .mt-co-tu{display:inline-block;font:900 9px Manrope,system-ui,sans-serif;padding:0 5px;margin-right:3px;border-radius:999px;color:#06231f;vertical-align:1px}
  </style>
<script src="assets/js/beta-readonly.js?v=5"></script>
  <style>
    /* niente barra della data: si cambia giorno solo dalla striscia dei giorni */
    #mio-turno .terra-bar .terra-day{display:none!important}
    /* striscia dei giorni (Il mio turno): il giorno scelto al centro, gli altri in trasparenza */
    .mt-giorni{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px calc(50% - 40px) 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .mt-giorni::-webkit-scrollbar{display:none}
    .mt-g{flex:0 0 80px;scroll-snap-align:center;display:grid;justify-items:center;gap:3px;padding:7px 4px;border-radius:16px;border:1px solid #1f4250;background:#102733;color:#eaf2f4;opacity:var(--o,.35);transform:scale(var(--s,.88));transition:opacity .25s,transform .25s;cursor:pointer;font:inherit}
    .mt-g.on{border:2px solid #2dd4bf;background:color-mix(in srgb,#2dd4bf 14%,#102733);box-shadow:0 0 14px rgba(45,212,191,.35)}
    .mt-g small{font:800 10px Manrope,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#9fb8c2}
    .mt-giorni{align-items:center}
    /* oggi: tessera piu' alta con la scritta OGGI, sempre in evidenza; scorrendo ci si ferma sempre su oggi */
    .mt-g.oggi{scroll-snap-stop:always;padding-top:5px;padding-bottom:10px;border:2px dashed rgba(45,212,191,.7)}
    .mt-g.oggi.on{border-style:solid}
    /* settimane separate: domenica in rosso, prima del lunedi' spazio con il numero della settimana */
    .mt-g.dom:not(.on){border-color:rgba(251,113,133,.55);background:color-mix(in srgb,#fb7185 12%,#102733)}
    .mt-g.dom small,.mt-g.dom b{color:#fb7185}
    /* giorno di paga: solo il fondo dorato */
    .mt-g.paga,.mt-g.paga.dom:not(.on){background:linear-gradient(160deg,color-mix(in srgb,#fbbf24 55%,#102733),color-mix(in srgb,#f59e0b 30%,#102733))}
    .mt-giorni{padding-top:20px}
    /* tessere strette: una settimana intera (e qualche giorno in piu') in una schermata */
    .mt-giorni{gap:4px;padding-left:calc(50% - 23px);padding-right:calc(50% - 23px)}
    .mt-g{flex:0 0 46px;gap:1px;padding:5px 0;border-radius:11px;position:relative}
    .mt-g small{font-size:9px;letter-spacing:.06em}
    .mt-g b{font-size:16px}
    .mt-g .t{min-width:0;max-width:42px;padding:0 5px;font-size:9px;overflow:hidden;text-overflow:clip;white-space:nowrap}
    .mt-g.oggi{padding-top:5px;padding-bottom:5px}
    .mt-oggi{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:8px;padding:0 5px}
    .mt-sett{flex:0 0 2px;align-self:stretch;position:relative;margin:-14px 3px 0;background:rgba(45,212,191,.35)}
    .mt-sett em{position:absolute;top:0;left:5px;font:800 9px Manrope,system-ui,sans-serif;font-style:normal;letter-spacing:.08em;color:#2dd4bf;white-space:nowrap}
    .mt-oggi{font:900 10px Manrope,system-ui,sans-serif;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:#06231f;background:#2dd4bf;border-radius:999px;padding:1px 8px}
    .mt-g b{font:500 19px 'DM Mono',ui-monospace,monospace}
    .mt-g .t{min-width:40px;padding:1px 7px;border-radius:999px;background:var(--c,#334155);color:#06231f;font:900 11px Manrope,system-ui,sans-serif;text-align:center}
    .mt-g .t.rip{background:transparent;border:1px solid #1f4250;color:#9fb8c2;font-weight:700}
    /* intestazione ad altezza fissa: righe di altezza fissa, mai a capo, cosi' la striscia dei giorni non si sposta */
    .mio-turno-page #turno-title{flex-wrap:nowrap;height:38px;white-space:nowrap;overflow:hidden;cursor:pointer}
    #turno-context{height:20px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    /* riga del servizio su una riga sola, con «inizia tra / fine tra» a destra; caratteri piu' piccoli sui telefoni stretti */
    #turno-servizio{display:flex!important;align-items:center;gap:5px;height:28px;white-space:nowrap;overflow:hidden;font-size:clamp(12.5px,3.9vw,16.8px)}
    #turno-servizio b,#turno-servizio .mt-durata{flex:none}
    #turno-servizio .mt-resto{flex:none;margin-left:auto;font-size:.8em;padding:.1rem .55rem}
    #turno-servizio.vuoto{color:#9fb8c2;font-size:.9rem}
    /* cambio giorno: il turno esce da un lato ed entra dall'altro, le righe arrivano una dopo l'altra */
    .mt-g{transition:opacity .12s linear,transform .12s linear,border-color .3s,background .3s,box-shadow .3s}
    @keyframes mt-esce-sx{to{opacity:0;transform:translateX(-56px) scale(.98)}}
    @keyframes mt-esce-dx{to{opacity:0;transform:translateX(56px) scale(.98)}}
    @keyframes mt-entra-sx{from{opacity:0;transform:translateX(64px)}to{opacity:1;transform:none}}
    @keyframes mt-entra-dx{from{opacity:0;transform:translateX(-64px)}to{opacity:1;transform:none}}
    #turno-content.mt-esce-sx,#turno-scali.mt-esce-sx,#turno-after.mt-esce-sx{animation:mt-esce-sx .15s ease-in forwards}
    #turno-content.mt-esce-dx,#turno-scali.mt-esce-dx,#turno-after.mt-esce-dx{animation:mt-esce-dx .15s ease-in forwards}
    .mt-entra-sx>*{animation:mt-entra-sx .38s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
    .mt-entra-dx>*{animation:mt-entra-dx .38s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
    @media (prefers-reduced-motion:reduce){.mt-esce-sx,.mt-esce-dx,.mt-entra-sx>*,.mt-entra-dx>*{animation:none!important}}
  </style>
</head>
<body class="servizi-terra-page mio-turno-page">
  <aside class="app-sidebar" id="mio-turno-sidebar"></aside>

  <header class="page-header">
    <p class="terra-label">IL MIO TURNO</p>
    <h1 class="terra-title" id="turno-title" role="link" tabindex="0" title="Apri la giornata nella Distinta">Il mio turno</h1>
    <p class="terra-context" id="turno-context">Caricamento…</p>
    <p class="mt-servizio" id="turno-servizio" hidden></p>
  </header>

  <main id="mio-turno">
    <div class="terra-bar">
      <span class="terra-day">
        <button type="button" class="terra-day-nav" id="turno-day-prev" aria-label="Giorno precedente">‹</button>
        <span class="terra-day-current"><span class="terra-day-label" id="turno-day-label"></span>
          <input type="date" class="terra-day-input" id="turno-day-input" aria-label="Scegli la giornata"></span>
        <button type="button" class="terra-day-nav" id="turno-day-next" aria-label="Giorno successivo">›</button>
        <button type="button" class="terra-day-today" id="turno-day-today" hidden>Oggi</button>
      </span>
      <label class="mt-test" title="Per provare la pagina con un altro turno (non cambia i dati)">
        <span>Prova turno</span>
        <select id="turno-test" aria-label="Prova con un altro turno"></select>
      </label>
    </div>
    <!-- giorni attorno a oggi: si scorrono a destra e sinistra insieme al turno -->
    <div class="mt-giorni" id="turno-giorni" aria-label="Giorni"></div>
    <div class="mt-mod-bar" id="turno-modified-bar" hidden style="display:none!important">
      <span class="mt-badge-mod" id="turno-modified-badge">Modificato da: <strong id="turno-modified-by"></strong></span>
      <button type="button" class="mt-restore-btn" id="turno-restore-btn" disabled>Ripristina turno originale</button>
    </div>
    <div class="terra-notice" id="turno-notice" hidden></div>
    <div class="terra-grid" id="turno-content"></div>
    <!-- La pagina Scali incorporata (assets/js/orario-page.js): a terra tutta la vista Lago del mio
         scalo, in linea la mappa con la mia corsa -->
    <section id="turno-scali" hidden>
      <details class="terra-card" id="turno-map" data-mt-section="mappa">
        <summary class="terra-card-head"><h2>Mappa</h2></summary>
        <div class="terra-card-body">
          <div class="terra-notice" id="orario-notice" hidden></div>
          <div id="orario-content"></div>
        </div>
      </details>
    </section>
    <div class="terra-grid" id="turno-after"></div>
  </main>
