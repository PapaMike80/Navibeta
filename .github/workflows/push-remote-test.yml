name: NaviSuite · Remote Web Push Test

on:
  workflow_dispatch:
    inputs:
      subscription_json:
        description: 'PushSubscription JSON copiato da NaviPush'
        required: true
        type: string
      title:
        description: 'Titolo notifica'
        required: true
        default: 'NaviSuite · Push remoto'
        type: string
      body:
        description: 'Testo notifica'
        required: true
        default: 'Test remoto ricevuto correttamente su iPhone ✅'
        type: string
      url:
        description: 'Pagina da aprire toccando la notifica'
        required: true
        default: 'https://papamike80.github.io/Navibeta/push-test/'
        type: string
  push:
    branches: ["main"]
    paths:
      - '.github/push-request.enc'

permissions:
  contents: read

jobs:
  send-push:
    runs-on: ubuntu-latest
    env:
      VAPID_PUBLIC_KEY: BC6uahr9cCmvN0YcxpNevngxZLrJRRNLTXujs3CUXXN2dGdHhQI5hVws-nph1pdCtMKzQU3EBmf4UMPde_uaq1w
      VAPID_PRIVATE_KEY: ${{ secrets.NAVISUITE_VAPID_PRIVATE_KEY }}
      SUBSCRIPTION_JSON: ${{ inputs.subscription_json }}
      PUSH_TITLE: ${{ inputs.title }}
      PUSH_BODY: ${{ inputs.body }}
      PUSH_URL: ${{ inputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica secret VAPID
        shell: bash
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::error::Manca il repository secret NAVISUITE_VAPID_PRIVATE_KEY"
            exit 1
          fi

      - name: Prepara sender Web Push
        run: npm install web-push@3.6.7 --no-save --ignore-scripts

      - name: Invia vero push remoto
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const webpush = require('web-push');

          let subscription;
          let title;
          let body;
          let url;

          if (process.env.GITHUB_EVENT_NAME === 'push') {
            const envelope = JSON.parse(fs.readFileSync('.github/push-request.enc', 'utf8'));
            const key = crypto.createHash('sha256').update(process.env.VAPID_PRIVATE_KEY, 'utf8').digest();
            const decipher = crypto.createDecipheriv('aes-256-gcm', key, Buffer.from(envelope.iv, 'base64url'));
            decipher.setAuthTag(Buffer.from(envelope.tag, 'base64url'));
            const plaintext = Buffer.concat([
              decipher.update(Buffer.from(envelope.ciphertext, 'base64url')),
              decipher.final()
            ]).toString('utf8');
            const request = JSON.parse(plaintext);
            subscription = request.subscription;
            title = request.title;
            body = request.body;
            url = request.url;
          } else {
            subscription = JSON.parse(process.env.SUBSCRIPTION_JSON);
            title = process.env.PUSH_TITLE;
            body = process.env.PUSH_BODY;
            url = process.env.PUSH_URL;
          }

          if (!subscription?.endpoint || !subscription?.keys?.p256dh || !subscription?.keys?.auth) {
            throw new Error('PushSubscription non valida: endpoint/keys mancanti');
          }

          webpush.setVapidDetails(
            'https://papamike80.github.io/Navibeta/',
            process.env.VAPID_PUBLIC_KEY,
            process.env.VAPID_PRIVATE_KEY
          );

          const payload = JSON.stringify({
            title,
            body,
            url,
            tag: 'navisuite-remote-' + Date.now(),
            renotify: true
          });

          webpush.sendNotification(subscription, payload, { TTL: 120 })
            .then(response => {
              console.log('Push inviato. Status:', response.statusCode);
            })
            .catch(error => {
              if (error?.statusCode) console.error('Push service status:', error.statusCode);
              if (error?.body) console.error('Push service response:', error.body);
              throw error;
            });
          NODE
