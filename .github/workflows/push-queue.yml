name: NaviSuite · Push Queue

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/push-queue.yml'

permissions:
  contents: write

concurrency:
  group: navisuite-push-queue
  cancel-in-progress: false

jobs:
  send-push-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VAPID_PUBLIC_KEY: BC6uahr9cCmvN0YcxpNevngxZLrJRRNLTXujs3CUXXN2dGdHhQI5hVws-nph1pdCtMKzQU3EBmf4UMPde_uaq1w
      VAPID_PRIVATE_KEY: ${{ secrets.NAVISUITE_VAPID_PRIVATE_KEY }}
      FIREBASE_API_KEY: AIzaSyBfJZWHjr3AIANDBj2p8uQ0_hbcHdmnSiE
      FIREBASE_DATABASE_URL: https://navisuite-f116f-default-rtdb.europe-west1.firebasedatabase.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostica avvio worker
        shell: bash
        run: |
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Avvio worker: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verifica VAPID
        shell: bash
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ]; then
            echo "::error::Manca il repository secret NAVISUITE_VAPID_PRIVATE_KEY"
            exit 1
          fi
          echo "Secret VAPID presente."

      - name: Prepara sender Web Push
        run: npm install web-push@3.6.7 --no-save --ignore-scripts

      - name: Processa coda notifiche
        id: queue
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const webpush = require('web-push');

          const API_KEY = process.env.FIREBASE_API_KEY;
          const DB = process.env.FIREBASE_DATABASE_URL.replace(/\/$/, '');
          const VAPID_PRIVATE_KEY = process.env.VAPID_PRIVATE_KEY;
          const STATE_FILE = '.github/push-firebase-auth.enc';
          const outputFile = process.env.GITHUB_OUTPUT;

          const safeKey = value => String(value || '').trim().replace(/[.#$\[\]\/]/g, '_');
          const encKey = crypto.createHash('sha256').update(VAPID_PRIVATE_KEY, 'utf8').digest();

          function encrypt(value) {
            const iv = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv('aes-256-gcm', encKey, iv);
            const ciphertext = Buffer.concat([cipher.update(JSON.stringify(value), 'utf8'), cipher.final()]);
            return {
              v: 1,
              alg: 'A256GCM',
              iv: iv.toString('base64url'),
              tag: cipher.getAuthTag().toString('base64url'),
              ciphertext: ciphertext.toString('base64url')
            };
          }

          function decrypt(envelope) {
            const decipher = crypto.createDecipheriv('aes-256-gcm', encKey, Buffer.from(envelope.iv, 'base64url'));
            decipher.setAuthTag(Buffer.from(envelope.tag, 'base64url'));
            const plaintext = Buffer.concat([
              decipher.update(Buffer.from(envelope.ciphertext, 'base64url')),
              decipher.final()
            ]).toString('utf8');
            return JSON.parse(plaintext);
          }

          async function jsonFetch(url, options = {}) {
            const response = await fetch(url, options);
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              const error = new Error(data?.error?.message || data?.error || `HTTP ${response.status}`);
              error.status = response.status;
              error.data = data;
              throw error;
            }
            return data;
          }

          async function signUpAnonymous() {
            const data = await jsonFetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${encodeURIComponent(API_KEY)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ returnSecureToken: true })
            });
            return { idToken: data.idToken, refreshToken: data.refreshToken };
          }

          async function refreshFirebase(refreshToken) {
            const data = await jsonFetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(API_KEY)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: refreshToken })
            });
            return { idToken: data.id_token, refreshToken: data.refresh_token || refreshToken };
          }

          async function firebaseAuth() {
            if (fs.existsSync(STATE_FILE)) {
              try {
                const state = decrypt(JSON.parse(fs.readFileSync(STATE_FILE, 'utf8')));
                if (state?.refreshToken) return await refreshFirebase(state.refreshToken);
              } catch (error) {
                console.warn('Auth Firebase cifrata non riutilizzabile, la rigenero:', error.message);
              }
            }
            const auth = await signUpAnonymous();
            fs.writeFileSync(STATE_FILE, JSON.stringify(encrypt({ refreshToken: auth.refreshToken }), null, 2) + '\n');
            fs.appendFileSync(outputFile, 'auth_state_created=true\n');
            return auth;
          }

          (async () => {
            const auth = await firebaseAuth();
            const db = async (path, options = {}) => {
              const url = `${DB}/${String(path).replace(/^\/+/, '')}.json?auth=${encodeURIComponent(auth.idToken)}`;
              const response = await fetch(url, {
                ...options,
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
              });
              const data = await response.json().catch(() => null);
              if (!response.ok) throw new Error(data?.error || `Firebase HTTP ${response.status}`);
              return data;
            };

            webpush.setVapidDetails(
              'https://papamike80.github.io/Navibeta/',
              process.env.VAPID_PUBLIC_KEY,
              VAPID_PRIVATE_KEY
            );

            const queueObject = await db('private/adminUpdates/pushQueue') || {};
            const pending = Object.entries(queueObject)
              .map(([key, value]) => ({ key, ...(value || {}) }))
              .filter(item => item.status === 'pending')
              .sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')))
              .slice(0, 20);

            console.log(`Notifiche in coda: ${pending.length}`);

            function allowedByPreferences(subscription, kind) {
              const prefs = subscription?.preferences || {};
              if (kind === 'tomorrow-summary') return prefs.tomorrowSummary !== false;
              if (kind === 'shift-change') return prefs.shiftChanges !== false;
              if (kind === 'ods') return prefs.ods !== false;
              return true;
            }

            async function subscriptionsFor(targetAgentId) {
              if (targetAgentId === '*') {
                const all = await db('private/adminUpdates/pushSubscriptions') || {};
                const list = [];
                Object.entries(all).forEach(([agentKey, devices]) => {
                  Object.entries(devices || {}).forEach(([deviceKey, item]) => list.push({ agentKey, deviceKey, ...(item || {}) }));
                });
                return list;
              }
              const agentKey = safeKey(targetAgentId);
              const devices = await db(`private/adminUpdates/pushSubscriptions/${agentKey}`) || {};
              return Object.entries(devices).map(([deviceKey, item]) => ({ agentKey, deviceKey, ...(item || {}) }));
            }

            for (const item of pending) {
              const queuePath = `private/adminUpdates/pushQueue/${safeKey(item.key)}`;
              await db(queuePath, {
                method: 'PATCH',
                body: JSON.stringify({ status: 'processing', processingAt: new Date().toISOString() })
              });

              let sent = 0;
              let failed = 0;
              let skipped = 0;
              const errors = [];
              try {
                const subscriptions = (await subscriptionsFor(String(item.targetAgentId || '')))
                  .filter(sub => sub.enabled !== false)
                  .filter(sub => allowedByPreferences(sub, item.kind));

                console.log(`Push ${item.id || item.key}: ${subscriptions.length} sottoscrizioni utilizzabili per ${item.targetAgentId || ''}`);

                for (const sub of subscriptions) {
                  if (!sub.endpoint || !sub.keys?.p256dh || !sub.keys?.auth) { skipped += 1; continue; }
                  const subscription = {
                    endpoint: sub.endpoint,
                    keys: { p256dh: sub.keys.p256dh, auth: sub.keys.auth }
                  };
                  const payload = JSON.stringify({
                    title: String(item.title || 'NaviSuite'),
                    body: String(item.body || ''),
                    url: String(item.url || 'naviturni.html'),
                    tag: `navisuite-${item.kind || 'push'}-${Date.now()}`,
                    renotify: true,
                    data: { kind: String(item.kind || '') }
                  });
                  try {
                    const response = await webpush.sendNotification(subscription, payload, { TTL: 600 });
                    console.log(`Push ${item.id || item.key} -> ${sub.agentId || item.targetAgentId}/${sub.deviceLabel || sub.deviceId}: ${response.statusCode}`);
                    sent += 1;
                  } catch (error) {
                    failed += 1;
                    const status = Number(error?.statusCode || 0);
                    errors.push(`${sub.deviceLabel || sub.deviceId || 'device'}:${status || error.message}`);
                    console.error(`Errore invio ${item.id || item.key}:`, status || error.message);
                    if (status === 404 || status === 410) {
                      try {
                        await db(`private/adminUpdates/pushSubscriptions/${safeKey(sub.agentId || item.targetAgentId)}/${safeKey(sub.deviceId || sub.deviceKey)}`, { method: 'DELETE' });
                        console.log('Sottoscrizione scaduta rimossa.');
                      } catch (_) { }
                    }
                  }
                }

                const finalStatus = sent > 0 ? (failed > 0 ? 'partial' : 'sent') : (subscriptions.length ? 'error' : 'no_subscriptions');
                await db(queuePath, {
                  method: 'PATCH',
                  body: JSON.stringify({
                    status: finalStatus,
                    processedAt: new Date().toISOString(),
                    sentCount: sent,
                    failedCount: failed,
                    skippedCount: skipped,
                    errorSummary: errors.slice(0, 5).join(' | ')
                  })
                });
              } catch (error) {
                console.error(`Errore push ${item.id || item.key}:`, error.message);
                await db(queuePath, {
                  method: 'PATCH',
                  body: JSON.stringify({ status: 'error', processedAt: new Date().toISOString(), errorSummary: String(error.message || error).slice(0, 500) })
                });
              }
            }

            const cutoff = Date.now() - 14 * 24 * 60 * 60 * 1000;
            for (const [key, item] of Object.entries(queueObject)) {
              if (!['sent','partial','error','no_subscriptions'].includes(String(item?.status || ''))) continue;
              const stamp = Date.parse(item?.processedAt || item?.createdAt || '');
              if (Number.isFinite(stamp) && stamp < cutoff) {
                try { await db(`private/adminUpdates/pushQueue/${safeKey(key)}`, { method: 'DELETE' }); } catch (_) { }
              }
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Salva stato Firebase cifrato
        if: steps.queue.outputs.auth_state_created == 'true'
        shell: bash
        run: |
          git config user.name "NaviSuite Push Worker"
          git config user.email "70916601+PapaMike80@users.noreply.github.com"
          git add .github/push-firebase-auth.enc
          if ! git diff --cached --quiet; then
            git commit -m "Store encrypted push Firebase auth state [skip ci]"
            git push
          fi
