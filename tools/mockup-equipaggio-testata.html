<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#071923;font-family:Manrope,system-ui,sans-serif;color:#e8f7f7;width:390px}
header{background:#091c25;padding:18px 16px 14px;border-bottom:1px solid #1f4250;position:relative}
.lab{color:#2dd4bf;font-size:12px;letter-spacing:.3em;font-weight:900}
.tit{display:flex;align-items:center;gap:10px;margin:8px 0 6px}.tit b{font-size:26px;font-weight:900}
.code{border:1.5px solid #3b6bcc;background:#13254a;color:#c9d8ff;border-radius:99px;padding:3px 13px;font-size:17px;font-weight:900}
.sub{color:#9fb8c2;font-size:13px;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chips span{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid #244653;font-size:12.5px;font-weight:900}.chips span::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--g)}.me{outline:2px solid #2dd4bf;outline-offset:1px}

.tab{height:330px;background:repeating-linear-gradient(#0f2129 0 38px,#16303a 38px 39px);display:grid;place-items:center;color:#4f6b77;font-size:12px}
</style></head><body>
<header><div class="menu">☰</div><div class="lab">NAVITURNI</div>

<div class="chips"><span style="--g:#facc15">SCARMIGLIATI M.</span><span style="--g:#a855f7">CIVETTINI G.</span><span style="--g:#22c55e">ALGERI A.</span><span style="--g:#3b82f6">CHIGNOLA M.</span><span class="me" style="--g:#e8f3f6">PEDRONI M.</span></div></header>

</body></html>
