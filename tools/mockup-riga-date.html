<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#071923;font-family:Manrope,system-ui,sans-serif;color:#e8f7f7;width:390px;padding:10px 0}
h3{font-size:12px;letter-spacing:.15em;color:#2dd4bf;margin:18px 14px 4px}h3 small{color:#86a5af;letter-spacing:0;font-weight:600;margin-left:6px}
.t{display:grid;grid-template-columns:110px repeat(7,40px);overflow:hidden;border-top:1px solid #1f4250;border-bottom:1px solid #1f4250;background:#0d2530}
.n{padding:0 8px;display:flex;align-items:center;font-size:12px;font-weight:900;color:#9fb8c2}
.c{height:44px;display:grid;place-items:center}
.r{display:contents}.r .n{height:40px;border-top:1px solid #16303a;color:#eaf2f4}.r .c{height:40px;border-top:1px solid #16303a}
.p{padding:3px 6px;border-radius:99px;font-size:12px;font-weight:800;border:1.5px solid color-mix(in srgb,var(--t) 70%,transparent);background:color-mix(in srgb,var(--t) 22%,#0b1c26);color:color-mix(in srgb,var(--t) 40%,#fff)}
.d{color:#4f6b77}
/* A tessere */
.A .h{margin:3px 2px;height:48px;border-radius:10px;border:1px solid #244653;background:#102733;display:grid;place-items:center;align-content:center;gap:0;line-height:1.05}
.A .h i{font-style:normal;font-size:9px;font-weight:800;color:#86a5af;letter-spacing:.08em}.A .h b{font:500 17px 'DM Mono',monospace}
.A .oggi{border:2px solid #2dd4bf;box-shadow:0 0 10px rgba(45,212,191,.35)}.A .oggi i{color:#2dd4bf}
.A .dom b{color:#fb7185}.A .dom{border-color:#5b2a35}
.A .paga{background:linear-gradient(160deg,color-mix(in srgb,#fbbf24 55%,#102733),color-mix(in srgb,#f59e0b 30%,#102733));border-color:#fbbf24}.A .paga i{color:#fde68a}
.A .bz{border-style:dashed;border-color:#f59e0b}
/* B minimal */
.B .h{display:grid;place-items:center;align-content:center;line-height:1.05;position:relative;height:48px}
.B .h i{font-style:normal;font-size:9px;font-weight:800;color:#86a5af}.B .h b{font-size:18px;font-weight:900}
.B .oggi{background:color-mix(in srgb,#2dd4bf 16%,transparent)}.B .oggi::after{content:'';position:absolute;bottom:0;left:6px;right:6px;height:4px;border-radius:4px 4px 0 0;background:#2dd4bf}.B .oggi i,.B .oggi b{color:#5eead4}
.B .dom b,.B .dom i{color:#fb7185}.B .we{background:rgba(255,255,255,.03)}
.B .paga b{color:#fbbf24}.B .paga::before{content:'€';position:absolute;top:2px;right:3px;font-size:9px;font-weight:900;color:#06231f;background:#fbbf24;border-radius:99px;width:13px;height:13px;display:grid;place-items:center}
.B .bz{box-shadow:inset 0 3px 0 #f59e0b}
/* C cerchi */
.C .h{display:grid;place-items:center;align-content:center;gap:2px;height:52px}
.C .h i{font-style:normal;font-size:9px;font-weight:800;color:#86a5af}.C .h b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900;border:1.5px solid transparent}
.C .oggi b{background:#2dd4bf;color:#06231f}.C .oggi i{color:#2dd4bf}
.C .dom b{color:#fb7185;border-color:#5b2a35}
.C .paga b{border:2px solid #fbbf24;color:#fde68a;box-shadow:0 0 10px rgba(251,191,36,.55);background:rgba(251,191,36,.12)}.C .paga i{color:#fbbf24}
.C .bz b{border:1.5px dashed #f59e0b}
.sep{box-shadow:inset 2px 0 0 #2dd4bf}
.leg{font-size:11px;color:#86a5af;margin:4px 14px 0}
</style></head><body>
<script>
const giorni=[['SAB',24,'oggi we'],['DOM',25,'dom we'],['LUN',26,'sep'],['MAR',27,'paga'],['MER',28,''],['GIO',29,''],['VEN',30,'']];
const righe=[['PEDRONI M.',['AGM','—','AGM','—','—','—','T2']],['SCARMIGLIATI M.',['T2','—','—','T2','—','—','T2']],['MODENA L.',['T2','T1','T1','—','T2','T1','T1']]];
const col={T1:'#5b8cff',T2:'#46c98a',AGM:'#f472b6',M1:'#f59a52'};
const tab=(k,tit,sub)=>`<h3>${tit}<small>${sub}</small></h3><div class="t ${k}"><div class="n">OTTOBRE</div>${giorni.map(g=>`<div class="h ${g[2]}"><i>${g[0]}</i><b>${g[1]}</b></div>`).join('')}${righe.map(r=>`<div class="r"><div class="n">${r[0]}</div>${r[1].map((x,i)=>`<div class="c ${giorni[i][2].includes('sep')?'sep':''}">${x==='—'?'<span class=d>—</span>':`<span class=p style="--t:${col[x]}">${x}</span>`}</div>`).join('')}</div>`).join('')}</div>`;
document.write(tab('A','A · TESSERE','come la striscia del Mio turno')+'<div class=leg>Oggi bordo verde acqua · paga fondo dorato · domenica rossa</div>');
document.write(tab('B','B · PULITA','solo numeri, oggi sottolineato')+'<div class=leg>Weekend appena più chiaro · paga numero oro con «€» · bozza linea arancio in alto</div>');
document.write(tab('C','C · CERCHI','numero nel cerchio')+'<div class=leg>Oggi cerchio pieno · paga anello d\'oro luminoso · domenica anello rosso</div>');
</script></body></html>
