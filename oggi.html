<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07131b">
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/icona_apple_180.png">
  <title>NaviSuite Oggi</title>
  <link rel="stylesheet" href="assets/css/navi-shared.css">
  <link rel="stylesheet" href="assets/css/navi-layout.css">
  <link rel="stylesheet" href="assets/css/turni-common.css">
  <link rel="stylesheet" href="assets/css/shared-menu.css">
  <style>
    body.oggi-page{background:radial-gradient(900px 460px at 15% -10%,#123846 0,transparent 62%),#07131b;color:#edf6f7;min-height:100vh}
    .oggi-shell{max-width:1320px;margin:0 auto;padding:7px 12px 110px}
    .oggi-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:0 0 22px;padding:23px 25px;border:1px solid #234452;border-radius:20px;background:linear-gradient(135deg,#0d2631,#0b1d27);box-shadow:0 12px 30px rgba(0,0,0,.18)}
    .oggi-kicker{margin:0 0 6px;color:#52ddc8;font-size:11px;font-weight:800;letter-spacing:.14em}
    .oggi-header h1{margin:0;font-size:clamp(27px,4vw,40px);line-height:1.05;letter-spacing:-.04em}
    .oggi-header p{margin:8px 0 0;color:#9bb4bc}
    .oggi-refresh{flex:0 0 auto;min-height:44px;padding:0 16px;border:1px solid #47cbb9;border-radius:12px;background:#123c3c;color:#a4fff1;font:inherit;font-weight:800;cursor:pointer}
    .oggi-refresh:hover{background:#18504e}.oggi-refresh:disabled{opacity:.6;cursor:wait}
    .oggi-status{margin:0 0 10px;padding:10px 13px;border:1px solid #234452;border-radius:13px;background:#0d202b;color:#9bb4bc;font-size:.93rem}.oggi-status.error{border-color:#a94f54;color:#fecaca;background:#2c171b}
    .oggi-pairs{display:block}.oggi-residence{margin:11px 0 0}.oggi-residence:first-child{margin-top:0}.oggi-residence.is-open{margin-top:11px}.oggi-residence:first-child.is-open{margin-top:0}
    .oggi-residence-title{display:flex;align-items:center;gap:8px;margin:0}.oggi-residence.is-open .oggi-residence-title{margin-bottom:5px}.oggi-residence-menu{flex:0 0 auto;width:40px;height:36px;border:1px solid #2dd4bf;border-radius:11px;background:#103a3d;color:#a7fff0;font-size:23px;font-weight:900}.oggi-residence-toggle{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;border:1px solid var(--res-color);border-radius:999px;background:color-mix(in srgb,var(--res-color) 18%,#0d202b);color:var(--res-color);font:850 13px/1 var(--navi-font-sans,system-ui);letter-spacing:.08em;cursor:pointer}.oggi-residence-chevron{display:inline-block;font-size:16px;line-height:1;transition:transform .18s ease}.oggi-residence-toggle[aria-expanded="true"] .oggi-residence-chevron{transform:rotate(180deg)}.oggi-residence-date{min-width:0;flex:1;color:#91adb6;font-size:12px;font-weight:750;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .oggi-grid{display:grid;grid-template-columns:1fr;gap:5px}.oggi-grid[hidden]{display:none!important}
    .oggi-card{overflow:hidden;border:1px solid #294b58;border-radius:13px;background:#0d202b;box-shadow:0 5px 15px rgba(0,0,0,.13)}
    .oggi-card-head{display:flex;align-items:center;width:100%;gap:10px;padding:8px 12px;border:0;background:linear-gradient(135deg,rgba(44,214,191,.13),rgba(23,51,63,.35));color:inherit;text-align:left;font:inherit;cursor:pointer}.oggi-card-head:focus-visible{outline:3px solid #73e7d8;outline-offset:-3px}
    .oggi-code{display:grid;place-items:center;min-width:47px;min-height:33px;padding:2px 6px;border:1px solid currentColor;border-radius:10px;color:var(--course-color,#62e4d0);font-size:16px;font-weight:900;letter-spacing:.02em}
    .oggi-card-copy{display:grid;gap:2px;min-width:0;flex:1}.oggi-card-copy strong{font-size:18px;line-height:1.05}.oggi-card-copy small{overflow:hidden;color:#9bb4bc;font-size:11px;font-weight:750;letter-spacing:.035em;text-overflow:ellipsis;white-space:nowrap}.oggi-card-arrow{color:#82ead9;font-size:22px;line-height:1;transition:transform .18s ease}.oggi-card.is-open .oggi-card-arrow{transform:rotate(180deg)}.oggi-card-body{display:none;border-top:1px solid #234452}.oggi-card.is-open .oggi-card-body{display:block}
    .oggi-crew{display:grid;gap:0;list-style:none;margin:0;padding:1px 12px 5px}.oggi-crew li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:27px;padding:2px 0;border-bottom:1px solid rgba(70,120,132,.2)}.oggi-crew li:last-child{border-bottom:0}
    .oggi-role-dot{width:8px;height:8px;border-radius:50%;background:var(--role-color,#94a3b8);box-shadow:0 0 0 3px color-mix(in srgb,var(--role-color,#94a3b8) 16%,transparent)}
    .oggi-crew-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:750}.oggi-role{color:#91adb6;font-size:11px;font-weight:750;text-align:right;white-space:nowrap}
    .oggi-no-crew{margin:0;padding:4px 12px 8px;color:#9bb4bc;font-size:13px;font-style:italic}.oggi-empty{padding:26px;border:1px dashed #365b65;border-radius:15px;color:#9bb4bc;text-align:center}
    .oggi-access{max-width:560px;margin:7vh auto;padding:26px;border:1px solid #a94f54;border-radius:18px;background:#25171b;color:#fecaca;text-align:center}.oggi-access h1{margin:0 0 8px;color:#fff}.oggi-access p{margin:0;color:#fecaca}
    .mobile-liquid-nav{display:none}#oggi-nav-popup[hidden]{display:none}#oggi-nav-popup{position:fixed;inset:0;z-index:1000;background:rgba(2,12,17,.62);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px;display:flex;justify-content:flex-end}#oggi-nav-popup-box{width:min(330px,92vw);max-height:78vh;overflow:auto;padding:16px;border:1px solid #2e6971;border-radius:20px;background:#0d2631}#oggi-nav-popup nav{display:grid;gap:6px}#oggi-nav-popup nav a{padding:12px;border:1px solid #28505a;border-radius:11px;color:#e7f8f8;text-decoration:none;font-weight:750}
    html.navisuite-light body.oggi-page{background:#edf5f6!important;color:#17323a!important}html.navisuite-light .oggi-header,html.navisuite-light .oggi-card,html.navisuite-light .oggi-status{background:#fff!important;border-color:#bcd8dd!important;color:#17323a!important;box-shadow:0 6px 20px rgba(27,62,70,.09)!important}html.navisuite-light .oggi-header p,html.navisuite-light .oggi-status,html.navisuite-light .oggi-card-copy small,html.navisuite-light .oggi-no-crew,html.navisuite-light .oggi-role,html.navisuite-light .oggi-residence-date{color:#547078!important}html.navisuite-light .oggi-card-head{background:#ecf7f6!important;border-color:#c6dde0!important}html.navisuite-light .oggi-residence-title::after,html.navisuite-light .oggi-crew li,html.navisuite-light .oggi-card-body{border-color:#d4e4e6!important}html.navisuite-light .oggi-refresh{background:#e2f5f1!important;border-color:#83cfc5!important;color:#087b6e!important}
    @media(max-width:800px){.mobile-liquid-nav{display:none!important}.oggi-shell{padding:7px 9px 105px}.oggi-header{padding:19px 17px;border-radius:16px}.oggi-header h1{font-size:30px}.oggi-header p{font-size:14px}.oggi-refresh{padding:0 12px}.oggi-residence{margin-top:9px}.oggi-residence.is-open{margin-top:9px}.oggi-residence-title{gap:6px}.oggi-residence.is-open .oggi-residence-title{margin-bottom:4px}.oggi-residence-toggle{padding:0 10px;font-size:12px;min-height:34px}.oggi-residence-menu{width:38px;height:34px}.oggi-residence-date{font-size:11px}.oggi-grid{grid-template-columns:1fr;gap:4px}.oggi-card{border-radius:12px}.oggi-card-head{padding:7px 10px}.oggi-crew{padding:0 10px 4px}.oggi-crew li{min-height:26px;padding:1px 0}.mobile-liquid-nav{position:fixed;z-index:100;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;display:flex;align-items:stretch;justify-content:space-around;min-height:63px;padding:7px;border:1px solid rgba(89,150,161,.38);border-radius:20px;background:rgba(9,27,36,.94);box-shadow:0 10px 32px rgba(0,0,0,.3);backdrop-filter:blur(14px)}.mobile-liquid-nav a,.mobile-liquid-nav button{display:grid;place-items:center;min-width:0;flex:1;border:0;border-radius:13px;background:transparent;color:#a8c6cc;font:700 11px/1 var(--navi-font-sans,system-ui);text-decoration:none}.mobile-liquid-nav a.active{background:rgba(56,214,191,.16);color:#8df7e5}.mobile-liquid-nav button{cursor:pointer}html.navisuite-light .mobile-liquid-nav{background:rgba(255,255,255,.92)!important}}
  </style>
</head>
<body class="turni-page oggi-page">
  <aside class="app-sidebar" aria-label="Navigazione principale"></aside>
  <main>
    <div class="oggi-shell">
      <p id="oggi-status" class="oggi-status" role="status" hidden></p>
      <section id="oggi-content" aria-live="polite"></section>
    </div>
  </main>
  <div id="oggi-nav-popup" hidden><div id="oggi-nav-popup-box"><button id="oggi-nav-close" aria-label="Chiudi">×</button><nav></nav></div></div>
  <script src="assets/js/admin-firebase-rest.js?v=38"></script>
  <script src="assets/js/shared-data.js?v=118"></script>
  <script src="assets/js/firebase-auth.js?v=2"></script>
  <script src="assets/js/shared-menu.js?v=1.54"></script>
  <script src="assets/js/oggi.js?v=10"></script>
</body>
</html>
