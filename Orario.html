<!doctype html>
<html lang="en" data-visualize-standalone>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NaviDiaria">
<meta name="theme-color" content="#002b5e">
<link rel="manifest" href="manifest.json">
<link rel="shortcut icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/images/icona_apple_180.png">
<link rel="apple-touch-startup-image" href="assets/images/splash_ios.png">
<meta name="referrer" content="no-referrer">
<title>NaviSuite Orario</title>
<link rel="stylesheet" href="assets/css/orario.css">
<link rel="stylesheet" href="assets/css/shared-menu.css">
</head>
<body class="turni-page orario-page">
<aside class="app-sidebar" id="orario-sidebar"></aside>
<main>
<div id="orario-garda-viz">
  <section class="og-page-chart" role="tabpanel">
  <div class="viz-controls og-selection-tools" aria-label="Selezione dell'orario">
    <div class="viz-row" aria-label="Selezione rapida dei turni">
      <button class="btn" id="og-tutte" type="button">Tutte</button>
      <button class="btn btn-ghost" id="og-nessuna" type="button">Nessuna</button>
    </div>
  </div>

  <div class="og-summary" aria-live="polite"></div>
  <div class="og-mobile-menu-backdrop" hidden></div>
  <div class="og-residences" aria-label="Turni per residenza"></div>
  <div class="og-chart-wrap">
    <div class="og-zoom-controls" aria-label="Controlli zoom">
      <span id="og-shadow-time-display" aria-label="Orario attuale">--:--</span>
      <input type="range" id="og-shadow-time" min="450" max="1250" value="450" 
        aria-label="Orario della linea d'ombra (passato)">
      <button class="btn og-mobile-menu-toggle" type="button" aria-expanded="false">Turni</button>
      <button class="og-coincidence-toggle" type="button" aria-pressed="true"
        aria-label="Mostra o nascondi le coincidenze ufficiali">⇄ ON</button>
      <button class="og-zoom-out" type="button" aria-label="Riduci">−</button>
      <button class="og-zoom-value" type="button"
        aria-label="Ripristina lo zoom al 100%">100%</button>
      <button class="og-zoom-in" type="button" aria-label="Ingrandisci">+</button>
      <a class="og-table-link" href="orari-tabella.html" aria-label="Apri la tabella degli orari">Tabella</a>
    </div>
    <div class="og-selected-course-pills" aria-live="polite" hidden>
      <div class="og-selected-course-pill-list og-selected-course-pill-list-main"></div>
      <div class="og-selected-course-pill-list og-selected-course-pill-list-coincidences" hidden></div>
    </div>
    <div class="og-chart-stage">
      <div class="og-stop-axis" aria-label="Fermate"></div>
      <div class="og-time-axis" aria-label="Orari"></div>
      <svg class="og-chart" role="img"
        aria-label="Diagramma spazio-tempo delle corse del Lago di Garda, filtrabile per turno e direzione.">
      </svg>
      <div class="tooltip og-tooltip" hidden></div>
    </div>
  </div>
  <div class="og-detail text-small text-muted" aria-live="polite">
    Passa su una linea o selezionala per vedere gli orari.
  </div>
  <dialog class="card og-course-card" aria-live="polite">
    <div class="og-course-heading">
      <div>
        <div class="og-course-kicker">CORSA</div>
        <h3 class="og-course-title"></h3>
      </div>
      <div class="og-course-code" aria-hidden="true"></div>
    </div>
    <div class="og-course-actions">
      <div class="viz-row">
        <button class="btn og-course-prev" type="button"
          aria-label="Corsa precedente">←</button>
        <button class="btn og-course-next" type="button"
          aria-label="Corsa successiva">→</button>
        <button class="btn btn-primary og-course-close" type="button">Chiudi</button>
      </div>
    </div>
    <div class="og-course-summary"></div>
    <div class="og-course-layout">
      <svg class="og-mini-chart" role="img" aria-label="Grafico della corsa selezionata"></svg>
      <table class="table og-course-stops">
        <thead>
          <tr><th>Fermata</th><th class="text-end">Orario</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </dialog>
  </section>
  <section class="og-page-matrix" role="tabpanel" hidden>
  <h3>Corse normali</h3>
  <div class="table-responsive">
    <table class="table table-sm og-matrix og-normal-matrix">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
  <h3>Servizi rapidi</h3>
  <div class="table-responsive">
    <table class="table table-sm og-matrix og-rapid-matrix">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
  </section>
</div>
</main>

<style>
  #orario-garda-viz {
    --background: #0b1c26;
    --foreground: #eaf2f4;
    --card: #102733;
    --card-foreground: #eaf2f4;
    --muted: #143140;
    --muted-foreground: #9fb8c2;
    --border: #1f4250;
    --accent: #2dd4bf;
    --accent-foreground: #06201c;
    color: var(--foreground);
    width: 100%;
    min-height: 100vh;
    padding: 1rem;
    background:
      radial-gradient(1200px 600px at 10% -10%, #123544 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #0e2a36 0%, transparent 55%),
      var(--background);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    box-sizing: border-box;
  }
  #orario-garda-viz * { box-sizing: border-box; }
  #orario-garda-viz .og-summary {
    margin: 0.75rem 0 0.5rem;
    font-weight: 500;
  }
  #orario-garda-viz .og-summary,
  #orario-garda-viz .og-selection-tools {
    display: none;
  }
  #orario-garda-viz .og-residences {
    position: absolute;
    z-index: 7;
    top: 0.45rem;
    left: 0.4rem;
    display: flex;
    flex-direction: column;
    width: 3.25rem;
    gap: 0.3rem;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    max-height: 85vh;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #orario-garda-viz .og-residences::-webkit-scrollbar {
    display: none;
  }
  #orario-garda-viz .og-mobile-menu-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 4.4rem;
    height: 2rem;
    padding: 0 0.85rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(16, 39, 51, 0.94);
    color: var(--foreground);
  }
  #orario-garda-viz .og-mobile-menu-backdrop {
    display: none;
  }
  #orario-garda-viz.og-turns-hidden .og-residences {
    display: none;
    pointer-events: none;
  }
  #orario-garda-viz .og-residence {
    display: block;
    flex-shrink: 0;
    padding: 0.12rem 0.16rem 0.18rem;
    border: 2px solid var(--residence-color);
    border-radius: 1.65rem;
    background: rgba(7, 23, 32, 0.96);
    min-width: 0;
  }
  #orario-garda-viz .og-residence-shifts {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.13rem;
    margin-top: 0.08rem;
  }
  #orario-garda-viz .og-shift-row {
    position: relative;
    display: grid;
    grid-template-columns: 1fr;
  }
  #orario-garda-viz .og-residence-name,
  #orario-garda-viz .og-shift-button {
    border-radius: 999px;
    text-transform: uppercase;
  }
  #orario-garda-viz .og-residence-name {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 1.12rem;
    padding: 0 0.2rem;
    border: 0;
    color: var(--residence-color);
    background: transparent;
    font-weight: 800;
    font-size: 0.72rem;
    letter-spacing: 0.045em;
    text-align: center;
  }
  #orario-garda-viz .og-residence-name[aria-pressed="true"] {
    background: transparent;
    color: var(--residence-color);
    box-shadow: none;
  }
  #orario-garda-viz .og-shift-button {
    width: 100%;
    min-width: 0;
    height: 1.45rem;
    padding: 0 0.08rem;
    border: 1px solid var(--shift-color);
    color: var(--shift-color);
    background: color-mix(in oklab, var(--shift-color) 9%, var(--background));
    font-size: 0.56rem;
    font-weight: 700;
    letter-spacing: 0;
  }
  #orario-garda-viz .og-shift-button[aria-pressed="true"] {
    background: color-mix(in oklab, var(--shift-color) 70%, var(--background));
    color: var(--foreground);
    box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--shift-color) 55%, transparent);
  }
  #orario-garda-viz .og-shift-button.is-route-muted {
    opacity: 0.14;
  }
  #orario-garda-viz .og-shift-button.is-route-active {
    opacity: 1;
    box-shadow: 0 0 0 2px color-mix(in oklab, var(--shift-color) 45%, transparent),
      0 0 10px color-mix(in oklab, var(--shift-color) 35%, transparent);
  }
  #orario-garda-viz .og-shift-expand {
    position: absolute;
    right: -0.08rem;
    top: -0.08rem;
    z-index: 2;
    width: 0.82rem;
    height: 0.82rem;
    padding: 0;
    border: 1px solid var(--shift-color);
    border-radius: 999px;
    color: var(--foreground);
    background: color-mix(in oklab, var(--shift-color) 58%, var(--background));
    font-size: 0.56rem;
    font-weight: 800;
    line-height: 1;
  }
  #orario-garda-viz .og-shift-expand[aria-expanded="true"] {
    transform: rotate(90deg);
  }
  #orario-garda-viz .og-race-list {
    position: absolute;
    z-index: 12;
    left: calc(100% + 0.45rem);
    top: -0.2rem;
    display: grid;
    grid-template-columns: repeat(3, minmax(2.7rem, 1fr));
    gap: 0.22rem;
    min-width: 9rem;
    max-width: 12rem;
    padding: 0.38rem;
    border: 2px solid var(--shift-color);
    border-radius: 0.75rem;
    background: rgba(7, 23, 32, 0.98);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
  }
  #orario-garda-viz .og-race-list[hidden] {
    display: none;
  }
  #orario-garda-viz .og-race-button {
    position: relative;
    min-width: 0;
    height: 1.55rem;
    padding: 0 0.22rem;
    border: 1px solid color-mix(in oklab, var(--shift-color) 72%, var(--border));
    border-radius: 999px;
    color: var(--shift-color);
    background: color-mix(in oklab, var(--shift-color) 8%, var(--background));
    font-size: 0.62rem;
    font-weight: 700;
  }
  #orario-garda-viz .og-race-button.is-selected {
    border-width: 2px;
    color: var(--foreground);
    background: color-mix(in oklab, var(--shift-color) 72%, var(--background));
    box-shadow: 0 0 0 2px color-mix(in oklab, var(--shift-color) 30%, transparent);
  }
  #orario-garda-viz .og-race-check {
    display: none;
    margin-left: 0.12rem;
  }
  #orario-garda-viz .og-race-button.is-selected .og-race-check {
    display: inline;
  }
  #orario-garda-viz .og-menu-actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.2rem;
    padding: 0.18rem;
    border: 1px solid var(--border);
    border-radius: 1.4rem;
    background: rgba(7, 23, 32, 0.96);
    position: sticky;
    bottom: 0;
    z-index: 2;
    margin-top: 0.2rem;
    flex-shrink: 0;
  }
  #orario-garda-viz .og-menu-action {
    display: grid;
    place-items: center;
    width: 100%;
    height: 1.65rem;
    padding: 0 0.1rem;
    border-radius: 999px;
    font-size: 0.5rem;
    font-weight: 800;
    text-transform: uppercase;
  }
  #orario-garda-viz .og-menu-master {
    border: 1px solid #ef4444;
    color: var(--foreground);
    background: color-mix(in oklab, #ef4444 72%, var(--background));
  }
  @media (pointer: coarse) and (orientation: portrait) {
    #orario-garda-viz .og-mobile-menu-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 4.4rem;
      height: 2rem;
      padding: 0 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(16, 39, 51, 0.94);
      color: var(--foreground);
    }
    #orario-garda-viz .og-mobile-menu-backdrop {
      position: fixed;
      inset: 0;
      z-index: 268;
      display: none;
      background: rgba(3, 10, 16, 0.28);
    }
    #orario-garda-viz .og-residences {
      position: fixed;
      z-index: 271;
      top: 0.75rem;
      left: 0.35rem;
      width: 4.1rem;
      max-height: 85vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.28rem;
      border: 1px solid var(--border);
      border-radius: 1.1rem;
      background: rgba(7, 23, 32, 0.84);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(10px);
      display: none;
      pointer-events: none;
    }
    #orario-garda-viz.og-mobile-menu-open .og-residences {
      display: flex;
      flex-direction: column;
      pointer-events: auto;
    }
    #orario-garda-viz .og-race-list {
      position: static;
      left: auto;
      top: auto;
      min-width: 0;
      max-width: none;
      margin-top: 0.22rem;
    }
    #orario-garda-viz .og-chart-wrap {
      margin-top: 0.5rem;
    }
    #orario-garda-viz .og-stop-axis {
      background: linear-gradient(90deg, #071720 72%, rgba(7, 23, 32, 0.84) 90%, transparent);
      box-shadow: 1px 0 0 rgba(31, 66, 80, 0.58);
    }
    #orario-garda-viz .og-stop-axis .og-axis-label {
      right: 0.35rem;
      gap: 0.08rem;
      width: calc(100% - 0.45rem);
      padding: 0 0 0 0.92rem;
    }
    #orario-garda-viz .og-stop-axis .og-stop-name {
      font-size: 0.8em;
      letter-spacing: -0.015em;
    }
    #orario-garda-viz .og-stop-axis .og-stop-time {
      font-size: 0.64em;
    }
    #orario-garda-viz .og-stop-axis .og-axis-label.is-shared-stop .og-stop-name {
      padding: 0.1rem 0.26rem;
    }
  }
  @media (pointer: coarse) and (orientation: landscape) {
    #orario-garda-viz .og-mobile-menu-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 4.4rem;
      height: 2rem;
      padding: 0 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(16, 39, 51, 0.94);
      color: var(--foreground);
    }
    #orario-garda-viz .og-mobile-menu-backdrop {
      position: fixed;
      inset: 0;
      z-index: 268;
      display: none;
      background: rgba(3, 10, 16, 0.18);
    }
    #orario-garda-viz .og-residences {
      position: fixed;
      z-index: 271;
      left: 0.5rem;
      right: 0.5rem;
      bottom: 0.4rem;
      top: auto;
      width: auto;
      max-height: 85vh;
      display: flex;
      flex-wrap: nowrap;
      align-items: stretch;
      gap: 0.35rem;
      overflow-x: auto;
      overflow-y: hidden;
      touch-action: pan-x;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0.3rem;
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: rgba(7, 23, 32, 0.84);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(10px);
      flex-wrap: nowrap;
      display: none;
      pointer-events: none;
    }
    #orario-garda-viz .og-residences::-webkit-scrollbar {
      display: none;
    }
    #orario-garda-viz.og-mobile-menu-open .og-residences {
      display: flex;
      flex-direction: row;
      pointer-events: auto;
    }
    #orario-garda-viz .og-residence {
      display: inline-flex;
      flex-shrink: 0;
      flex: 0 0 auto;
      flex-direction: row;
      align-items: center;
      min-width: max-content;
      padding: 0.18rem 0.25rem;
      border-radius: 1rem;
    }
    #orario-garda-viz .og-residence-shifts {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      flex-wrap: nowrap;
      gap: 0.18rem;
      margin-top: 0;
      margin-left: 0.22rem;
    }
    #orario-garda-viz .og-shift-row {
      display: inline-flex;
      flex: 0 0 auto;
      grid-template-columns: 1fr;
      min-width: 2.55rem;
    }
    #orario-garda-viz .og-residence-name {
      width: 1.5rem;
      height: 1.45rem;
      font-size: 0.68rem;
    }
    #orario-garda-viz .og-shift-button {
      height: 1.5rem;
      padding: 0 0.18rem;
      font-size: 0.58rem;
    }
    #orario-garda-viz .og-shift-expand {
      right: -0.1rem;
      top: -0.1rem;
    }
    #orario-garda-viz .og-race-list {
      position: absolute;
      left: 50%;
      right: auto;
      top: auto;
      bottom: calc(100% + 0.32rem);
      transform: translateX(-50%);
      min-width: 8.2rem;
      max-width: 10rem;
      grid-template-columns: repeat(3, minmax(2.4rem, 1fr));
    }
    #orario-garda-viz .og-stop-axis .og-axis-label {
      right: 0.22rem;
      width: calc(100% - 0.28rem);
      padding: 0 0 0 0.58rem;
    }
    #orario-garda-viz .og-stop-axis .og-stop-name {
      font-size: 0.74em;
      letter-spacing: -0.02em;
    }
    #orario-garda-viz .og-stop-axis .og-stop-time {
      font-size: 0.6em;
    }
    #orario-garda-viz .og-menu-actions {
      display: flex;
      align-items: center;
      padding: 0.12rem;
      border-radius: 1rem;
      position: sticky;
      right: 0;
      margin-left: auto;
      align-self: stretch;
      flex: 0 0 auto;
    }
    #orario-garda-viz .og-menu-action {
      min-width: 2.8rem;
      height: 1.5rem;
      padding: 0 0.3rem;
      font-size: 0.54rem;
    }
  }
  #orario-garda-viz .og-chart-wrap {
    position: relative;
    width: 100%;
    height: calc(100dvh - 4.75rem);
    height: calc(100vh - 4.75rem);
    min-height: calc(100dvh - 4.75rem);
    min-height: calc(100vh - 4.75rem);
    overflow: auto;
    overscroll-behavior: contain;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: rgba(7, 23, 32, 0.74);
    scrollbar-color: var(--accent) #071720;
    scrollbar-width: none;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  }
  #orario-garda-viz .og-chart-wrap::-webkit-scrollbar {
    display: none;
  }
  @media (max-height: 820px) {
    #orario-garda-viz .og-chart-wrap {
      height: calc(100dvh - 4.25rem);
      height: calc(100vh - 4.25rem);
      min-height: calc(100dvh - 4.25rem);
      min-height: calc(100vh - 4.25rem);
    }
  }
  #orario-garda-viz .og-zoom-controls {
    position: fixed;
    z-index: 260;
    top: 0.75rem;
    right: 1rem;
    width: max-content;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.25rem 0.35rem;
    border: 1px solid var(--line, #1f4250);
    border-radius: 999px;
    background: rgba(16, 39, 51, 0.94);
    color: var(--muted-foreground);
    font-size: 0.72rem;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.28);
  }
  #orario-garda-viz .og-selected-course-pills {
    position: fixed;
    z-index: 259;
    top: 5.35rem;
    right: 1rem;
    width: min(15.75rem, calc(100vw - 1rem));
  }
  #orario-garda-viz .og-selected-course-pill-list {
    gap: 0.32rem;
  }
  #orario-garda-viz .og-selected-course-pill-list-main {
    display: flex;
    flex-direction: column;
  }
  #orario-garda-viz .og-selected-course-pill-list-coincidences {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    margin-top: 0.5rem;
  }
  #orario-garda-viz .og-selected-course-pill {
    --pill-color: var(--accent);
    --pill-bg: rgba(16, 39, 51, 0.92);
    --pill-border: rgba(45, 212, 191, 0.28);
    display: flex;
    flex-direction: column;
    gap: 0.12rem;
    min-width: 0;
    padding: 0.42rem 0.56rem;
    border: 1px solid var(--pill-border);
    border-radius: 0.9rem;
    background:
      linear-gradient(145deg, rgba(255, 255, 255, 0.04), transparent),
      var(--pill-bg);
    box-shadow:
      0 10px 26px rgba(0, 0, 0, 0.28),
      inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(8px);
    cursor: pointer;
  }
  #orario-garda-viz .og-selected-course-pill-label {
    color: var(--pill-color);
