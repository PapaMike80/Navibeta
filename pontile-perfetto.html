<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NaviBeta">
  <meta name="theme-color" content="#0d1a1c">
  <title>NaviBeta Pontile perfetto</title>
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/icona_apple_180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/shared-menu.css?v=2">
  <style>
    /* Pontile perfetto: scuola di manovra d'attracco con due manette e timone (docs/STILE-NAVISUITE.md) */
    :root{--surface:#0b1c26;--card:#102733;--card2:#143140;--line:#1f4250;--ink:#eaf2f4;--muted:#9fb8c2;--on:#06231f;--teal:#2dd4bf;--cyan:#67d7e6;--violet:#a78bfa;--amber:#fbbf24;--rose:#fb7185;--green:#52c879}
    *{box-sizing:border-box}
    body.gioco-page{margin:0;min-height:100vh;background:var(--surface);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
    .gioco-page .app-sidebar{display:none}
    .gioco-page>header{display:flex;align-items:center;justify-content:space-between;gap:16px;width:min(520px,100%);margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 10px}
    .gioco-page>header small{display:block;color:var(--teal);font-size:11px;font-weight:800;letter-spacing:.2em}
    .gioco-page>header h1{margin:4px 0 0;font-size:25px;font-weight:800}
    .gioco-page>header #navisuite-header-menu{position:static!important;flex-shrink:0;width:48px!important;height:48px!important;border:1px solid var(--teal)!important;border-radius:14px!important;background:var(--card)!important;color:var(--teal)!important;font-size:22px!important}
    main{width:min(520px,100%);margin:0 auto;padding:4px 14px 40px}
    .livelli{display:flex;gap:6px;margin-bottom:8px}.livelli button{flex:1;padding:8px 4px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:800 12px Manrope,system-ui,sans-serif}.livelli button.on{background:var(--teal);color:var(--on);border-color:var(--teal)}.livelli small{color:var(--amber);font-weight:900}.livelli button.on small{color:var(--on)}
    .info{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin-bottom:8px}.info span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 9px}.info b{color:var(--amber)}
    #pp-mare{width:100%;height:auto;display:block;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#0f3a4d,#0b2a38)}
    .dati{font-size:12.5px;color:var(--amber);text-align:center;margin:6px 0}
    .avviso{font-size:12px;color:var(--muted);text-align:center;min-height:16px;margin:0 0 6px}
    .comandi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:stretch}
    .manetta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;width:74px}
    .manetta h3{margin:0;font-size:10px;letter-spacing:.12em;color:var(--teal)}
    .manetta .scala{display:flex;gap:4px;align-items:center;height:150px}
    .manetta input{writing-mode:vertical-lr;direction:rtl;width:34px;height:150px;accent-color:var(--teal)}
    .manetta .tacche{display:flex;flex-direction:column;justify-content:space-between;height:150px;font-size:9.5px;color:var(--muted);font-weight:800}
    .centro{display:flex;flex-direction:column;gap:8px}
    .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px}.box h3{margin:0 0 6px;font-size:10px;letter-spacing:.12em;color:var(--amber)}
    #pp-timone{width:100%;accent-color:var(--amber)}.tim-et{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
    .cime{display:flex;flex-direction:column;gap:6px}.cime button{padding:11px;border-radius:12px;font:800 13px Manrope,system-ui,sans-serif;background:var(--card);border:1px solid color-mix(in srgb,var(--violet) 50%,transparent);color:var(--violet)}.cime button:disabled{opacity:.35}
    .pp-voto{display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--green) 12%,var(--card));border:1px solid color-mix(in srgb,var(--green) 50%,transparent);border-radius:16px;padding:12px;margin:6px 0 4px}.pp-voto.ko{background:color-mix(in srgb,var(--rose) 12%,var(--card));border-color:color-mix(in srgb,var(--rose) 50%,transparent)}
    .pp-voto b{font-size:40px;color:var(--green)}.pp-voto.ko b{color:var(--rose)}.pp-voto small{display:block;color:var(--muted)}
    .pp-riga{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0;font-size:13px}.pp-riga .ok{color:var(--green)}.pp-riga .no{color:var(--rose)}.pp-riga .mid{color:var(--amber)}
    .pp-tip{margin-top:10px;background:var(--card);border-left:3px solid var(--amber);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4}.pp-tip>b:first-child{color:var(--amber)}
    .pp-tip.parola{border-color:var(--cyan)}.pp-tip.parola b{color:var(--cyan)}
    .pp-azioni{display:flex;gap:8px;margin-top:12px}.pp-azioni button{flex:1;padding:12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--teal) 45%,transparent);background:var(--card);color:var(--ink);font:800 14px Manrope,system-ui,sans-serif}.pp-azioni button.ok{background:var(--teal);color:var(--on);border:0}
  </style>
<script src="assets/js/beta-readonly.js?v=5"></script>
</head>
<body class="gioco-page">
  <aside class="app-sidebar" aria-hidden="true"></aside>
  <header class="page-header"><div><small>NAVISUITE · SCUOLA DI MANOVRA</small><h1>Pontile perfetto</h1></div></header>
  <main>
    <div class="livelli" id="pp-livelli"></div>
    <div class="info" id="pp-info"></div>
    <section id="pp-gioco">
      <svg id="pp-mare" xmlns="http://www.w3.org/2000/svg" aria-label="Pontile e nave"><g id="pp-fisso"></g><g id="pp-nave"></g></svg>
      <p class="dati" id="pp-dati"></p>
      <p class="avviso" id="pp-avviso">Porta la nave di fianco al pontile, lenta, e dai le cime.</p>
      <div class="comandi">
        <div class="manetta"><h3>SINISTRA</h3><div class="scala"><div class="tacche"><span>AT</span><span>A</span><span>0</span><span>I</span><span>IT</span></div><input type="range" id="pp-sx" min="-2" max="2" step="1" value="1" aria-label="Manetta di sinistra"></div></div>
        <div class="centro">
          <div class="box"><h3>TIMONE</h3><input type="range" id="pp-timone" min="-35" max="35" step="5" value="0" aria-label="Timone"><div class="tim-et"><span>◀ sinistra</span><span>dritta ▶</span></div></div>
          <div class="cime"><button type="button" data-cima="prua">➰ Cima di prua</button><button type="button" data-cima="poppa">➰ Cima di poppa</button></div>
        </div>
        <div class="manetta"><h3>DRITTA</h3><div class="scala"><input type="range" id="pp-dx" min="-2" max="2" step="1" value="1" aria-label="Manetta di dritta"><div class="tacche"><span>AT</span><span>A</span><span>0</span><span>I</span><span>IT</span></div></div></div>
      </div>
    </section>
    <section id="pp-esito" hidden></section>
  </main>
  <script src="assets/js/shared-roles.js?v=16"></script>
  <script src="assets/js/admin-firebase-rest.js?v=95"></script>
  <script src="assets/js/shared-data.js?v=137"></script>
  <script src="assets/js/firebase-auth.js?v=2"></script>
  <script src="assets/js/shared-menu.js?v=2.02"></script>
  <script src="assets/js/offline.js?v=2"></script>
  <script src="assets/js/pontile-perfetto.js?v=1"></script>
</body>
</html>
